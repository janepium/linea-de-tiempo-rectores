                    "text": {
                        "headline": "Fidel Cano Gutiérrez",
                        "text": "Este periodista y educador nació en San Pedro de los MIlagros (Antioquia) en 1854. Su educación transcurrió al lado de personajes reconocidos como el institutor Rodolfo Cano, y luego junto al profesor Juan José Molina, con quien comenzó a sentir inclinaciòn por la literatura, e incluso realizó algunos escritos poéticos para un periódico estudiantil. En 1879 se radicó en Medellín donde ocupò cargos como educador, redactor de revistas, secretario de hacienda y director del periódico “La Idea”, entre otros. Por otro lado, para esta época el Colegio Central pasaba por un momento difícil de luchas a nivel local debido al manejo que se le había dado a Antioquia desde años atràs en manos de los mismos mandatarios. Ello causó una división en la Institución provocando un mal momento para el claustro educativo. Es por este momento donde Fidel Cano asume la rectoría, siendo testigo de la época en que acaece la “revolución encabezada por Gaitán y Jorge Isaac contra el gobierno de Pedro Restrepo Uribe. Durante su rectorado, y debido a la situación de conflicto que se vivía, la Junta Suprema se vio en la obligación de clausurar la Universidad, sumado a la aparición de un brote de viruela en la población. Además de ejercer también como diputado en la Asamblea Departamental de Antioquia y senador de la República, gran parte de su vida la dedicó al ejercicio periodístico, trabajando en periódicos como La Unión, La Correspondencia y El Trabajo. Cano fue también el fundador de El Espectador, uno de los periódicos más importantes del país, aún vigente. Durante su actividad, Fidel Cano se encargó de demandar asuntos relacionados con los derechos de los hombres, hasta su fallecimiento el 15 de enero de 1919 en Medellín."
                    },

                    "media": {
                        "url": "img/rectores-xix/fidel-cano.jpg",
                        "caption": "Foto oficial del rector Fidel Cano Gutiérrez"
                        
                    }
                },

                {
                    "start_date": { "year": "1882" },
                    "end_date": { "year": "1884" },
                    "text": {
                        "headline": "Alvaro Restrepo Eusse",
                        "text": "Álvaro Restrepo Eusse nació en Yarumal (Antioquia) en enero de 1844. Estudió jurisprudencia en el Colegio del Estado y posteriormente se trasladó a Bogotá para finalizar su educación académica. Al terminar sus estudios ejerció como abogado en varios lugares, entre ellos Medellín y Manizales; además ocupó varios cargos en Antioquia como alcalde, diputado y senador. Otro de los aspectos relevantes de su vida profesional fue su papel como redactor en la prensa, publicando para varios periódicos como El Heraldo, El Guardián, y La Consigna, entre otros. Estuvo presente en la Universidad después del mal momento por el que pasó la misma algunos años atrás con las disputas entre liberales y conservadores. Durante su periodo rectoral hubo calma política y las matrículas aumentaron a pesar de que muchos de los padres enviaron a sus hijos al seminario por temor a las enseñanzas laicas impartidas en la Alma Máter. Sumado a esto, Restrepo Eusse no fue participe de los dogmas católicos y esto se evidenció en asuntos como negar la existencia de Dios, no permitir la clase de religión, entre otros aspectos que apuntaban a “declarar ser cualquier cosa, menos espiritualista y cristiano”. Por otro lado fomentó una educación práctica en el lugar, otorgando locales y materiales, e incluso intentó establecer la Escuela de Minería. Debido a estas posiciones fue mucho más claro lo que se pensaba acerca del plantel y su manejo para dicha época. Restrepo falleció en Medellín el 3 de octubre de 1910."
                    },

                    "media": {
                        "url": "img/rectores-xix/alvaro-restrepo-eusse.jpg",
                        "caption": "Foto oficial del rector Alvaro Restrepo Eusse"
                        
                    }
                },

                {
                    "start_date": { "year": "1884" },
                    
                    "text": {
                        "headline": "Federico Alejandro Uribe Uribe",
                        "text": "Federico Uribe nació en Rionegro el 9 de Julio de 1838. Asumió el cargo de rector por un corto período en 1884. Fue su padre quien comenzó de forma organizada la labor de la enseñanza en Rionegro, lo que conllevó a que la niñez de Uribe transcurriera en medio de actividades educativas. Cursó estudios en el Colegio del Estado sin llegar a recibir el título de doctor. Posteriormente ejerció varios cargos en relación con lo militar y político: general del ejército, secretario del presidente del estado del Cauca y diputado de Antioquia. Dedicó los últimos años de su vida a escribir sobre personajes ilustres de Antioquia, obra que cedió a la Academia Nacional de Historia y de la que actualmente se desconoce su paradero. Murió el 27 de octubre de 1911 en Tuluá (Valle del Cauca)."
                    },

                    "media": {
                        "url": "img/rectores-xix/federico-alejandro-uribe.jpg",
                        "caption": "Foto oficial del rector Federico Alejandro Uribe Uribe"
                        
                    }
                },

                {
                    "start_date": { "year": "1884" },
                    
                    "text": {
                        "headline": "Eduardo Antonio Hoyos",
                        "text": "Eduardo Hoyos nació en 1847 en Manizales. Comenzó sus estudios en Medellín, pero en 1871 se trasladó a Bogotá para terminarlos y graduarse como doctor en jurisprudencia en el Colegio Mayor de Nuestra Señora del Rosario. Ejerció varios cargos importantes, uno de ellos, fue el nombramiento que recibió como catedrático en la Universidad relacionándose así con este ámbito educativo, además de haber sido propuesto para el discurso de clausura de las clases. Durante su período como rector del Colegio Central (1884) también impartió las cátedras de historia y derecho. Posteriormente regresó a Manizales, donde fungió como secretario. Allí murió el 3 de octubre de 1913."
                    },

                    "media": {
                        "url": "img/rectores-xix/eduardo-antonio-hoyos.jpg",
                        "caption": "Foto oficial del rector Eduardo Antonio Hoyos"
                        
                    }
                },

                {
                    "start_date": { "year": "1885" },
                    
                    "text": {
                       
                        "text": "Se acercaba el siglo XX y con esto se consolidó definitivamente el nombre que actualmente lleva la Institución: Universidad de Antioquia En medio de las guerras dadas entre los diferentes partidos políticos, principalmente después de la primera mitad del siglo XIX, para 1885 resurgieron algunas disputas que trajeron consigo cambios políticos, como la reforma a la Constitución Federal por el centralismo. En el campo educativo también se dieron transformaciones importantes que resultaron en la centralización de la capital, y a su vez quedó en manos de la iglesia católica. De esta forma la reapertura de la Alma Máter tuvo un momento difícil, teniendo en cuenta que en algunas ocasiones el lugar fue base militar y su infraestructura se encontraba en malas condiciones. Sin embargo, esto no evitó que la dirección de la institución fuera entregada a los jesuitas, quienes también se encargaron de abrir nuevos lugares, entre ellos el Colegio San Ignacio. Con todo el asunto del mando religioso en lo académico, la Universidad sufrió también múltiples cambios, a la vez que le fueron expropiados los claustros y algunos instrumentos musicales. También fue cerrada la Escuela de Artes y Oficios en el mandato del gobernador Marceliano Vélez. Lo que se buscaba con todo esto era volver a una “moralidad” más centrada bajo la religión. Por otro lado, también se hicieron cambios desde lo académico con un nuevo plan de estudios, en donde se habló de la estructura física, las facultades y política: • Solo tres facultades: Filosofía y Letras, Jurisprudencia y Ciencias Políticas, y Medicina y Cirugía. • Compleja estructura administrativa. • Uniformes. • Control disciplinario."
                    }

                    
                },

                {
                    "start_date": { "year": "1890" },
                   
                    "text": {
                        "headline": "Marceliano Vélez",
                        "text": "Marceliano Vélez nació en Envigado el 18 de junio de 1832. A los 12 años viaja a Santa Marta, donde conoció algunos personajes que posiblemente influyeron en su pensamiento político, entre ellos su profesor Manuel Murillo Toro, quien más tarde sería presidente de la república. Ocho años después de haber terminado sus estudios en jurisprudencia, volvió a Medellín donde completó su formación en 1853 en la Universidad de Antioquia, convirtiéndose en el primer egresado de la Institución. Vélez tuvo una participación muy amplia en el ámbito político, debido quizá al acercamiento que ya había tenido en su formación académica. Tal participación se dio primeramente en 1854, en contra de la dictadura del presidente José María Melo. En medio de las guerras civiles que asolaron el país durante todo el siglo XIX, Vélez ocupó el cargo de gobernador de Antioquia em cinco oportunidades, cargo relevante tanto para él como para los habitantes antioqueños, pues defendía los intereses conservadores. En cuanto a su periodo como rector de la Universidad, fue nombrado en 1890 ejerciendo el cargo durante un año, periodo que se cumple por las elecciones presidenciales de la época, donde tuvo alta participación junto con Rafael Núñez. Vélez también fungió como abogado, senador de Antioquia y docente en la Escuela Normal Superior de Varones de Medellín. Murió en Medellín en 1923."
                    },

                    "media": {
                        "url": "img/rectores-xix/marceliano-velez.jpg",
                        "caption": "Foto oficial del rector Marceliano Vélez"
                        
                    }
                },

                {
                    "start_date": { "year": "1891" },
                    
                    "text": {
                        "headline": "Tomás Bernal Mejía",
                        "text": "Tomás Bernal nació en 1852 en el municipio de La Ceja, Antioquia. Estudió allí mismo bajo una formación inculcada con valores basados en preceptos religiosos. Además, después de haber realizado su primera formación, logró graduarse como doctor en medicina en 1875. Ya en sus responsabilidades laborales cabe destacar principalmente dos con respecto a la Universidad de Antioquia. Por un lado, se dedicó a dictar por largo tiempo la cátedra de anatomía, y en 1851 fue designado vicerrector tras la muerte del profesor Marco Antonio Ochoa. No obstante, en octubre de ese mismo año fue nombrado como rector debido al buen cumplimiento de sus labores, cargo que ocupó durante un año, para ser nuevamente elegido entre 1902 y 1904. Luego de su permanencia en el claustro universitario continuó en asuntos de índole académico, esencialmente en la docencia, donde fue considerado por muchos como apto y entregado a dicha labor hasta su muerte en diciembre de 1917."
                    },

                    "media": {
                        "url": "img/rectores-xix/tomas-bernal.jpg",
                        "caption": "Foto oficial del rector Tomás Bernal Mejía"
                        
                    }
                },

                {
                    "start_date": { "year": "1892" },
                    "end_date": { "year": "1896" },
                    "text": {
                        "headline": "Luciano Carvalho",
                        "text": "Originario de Sopetrán (Antioquia), Carvalho recibió su educación al lado de unos parientes que se hicieron cargo de él dado que era huérfano. Posteriormente le ayudo el sacerdote Benito Jaramillo García, quien se encargó de obtener una beca para que pudiera continuar sus estudios en un colegio particular, el cual se encontraba a cargo de Mariano Ospina. Allí se comenzó a tejer una relación de protectorado del señor Ospina a Carvalho; incluso cuando el primero es elegido presidente de Colombia, no prescindió de su “discípulo”, puesto que lo llevó a Bogotá para trabajar en conjunto sin dejar de lado sus intereses académicos. Posteriormente, con los disturbios dados en 1860, tuvo varias disputas como alférez, precisamente por la defensa que otorgó a su amigo el doctor Ospina. Además se vio en la obligación de retirarse a Venezuela debido a los mismos altercados. Una vez allí comenzó a ejercer la enseñanza académica, en la ciudad de San Cristóbal. A su regreso a Medellín en 1864, empezó a ejercer en lugares como el seminario y las escuelas normales, dictando materias como álgebra, filosofía y religión. No obstante, mantuvo una postura más de cara a la filosofía, puesto que fue en esta materia que se destacó como profesor en la Universidad de Antioquia, lo que le valió el nombramiento como rector entre 1892 y 1896. Tras su paso como rector de la Alma Máter, ejerció como notario y diputado a la Asamblea de Antioquia, hasta su muerte el 29 de enero de 1928."
                    },

                    "media": {
                        "url": "img/rectores-xix/luciano-carvalho.jpg",
                        "caption": "Foto oficial del rector Luciano Carvalho"
                        
                    }
                },

                {
                    "start_date": { "year": "1896" },
                    "end_date": { "year": "1899" },
                    "text": {
                        "headline": "Eduardo Zuleta Gaviria",
                        "text": "Eduardo Zuleta nació en 1860 en Remedios (Antioquia). A los 10 años se trasladó a Medellín donde cursó algunos estudios, y posteriormente se graduó como médico en Bogotá. Más tarde se trasladó a Estados Unidos para seguir con su actividad académica. De regreso a Medellín ejerció en la Universidad de Antioquia dictando algunas cátedras, y en 1892 fue nombrado rector de la Escuela Nacional de Minas donde desempeñó un buen papel. Según el autor César García, dicho lugar se encontraba en condiciones “deplorables” y fue Zuleta quien ayudó al buen funcionamiento de esa institución. Su designación como rector de la Universidad de Antioquia se dio en 1896 y coincidió con una gran acogida a los estudiantes de la Escuela de Minas, que había sido cerrada un año antes. Durante su cargo como rector implementó una serie de cambios tanto en la infraestructura como en la planta docente, trayendo al plantel profesores más preparados en cada una de sus especialidades. También se encargó de la adecuación de los laboratorios con el fin de ofrecer estudios más prácticos en la Facultad de Medicina. Se retiró de la Universidad para encargarse de asuntos diplomáticos en España. Dentro de sus actividades posteriores también formó parte de la Academia de Historia (desde 1903). Fue diputado a la Asamblea Departamental de Antioquia, primer director de la Escuela de Veterinaria de Medellín y perteneció a algunas instituciones literarias. Zuleta murió en Bogotá el 12 de agosto de 1937."
                    },

                    "media": {
                        "url": "img/rectores-xix/eduardo-zuleta.jpg",
                        "caption": "Foto oficial del rector Eduardo Zuleta Gaviria"
                        
                    }
                },

                {
                    "start_date": { "year": "1899" },
                   
                    "text": {
                        "headline": "Tomás Herrán",
                        "text": "Nació en 1843 en Bogotá, bajo el cuidado de sus padres Ana Mosquera y el presidente de la Nueva Granada, Pedro Alcántara Herrán. En 1847 se trasladó con su padre a Nueva York, donde cursó sus estudios que luego terminó en la Universidad de Georgetown como Doctor en Filosofía y Letras. De esta forma continuó su labor académica hasta 1899, cuando se graduó con el título de Doctor en Derecho. Trabajó en Medellín, especialmente en el orden que propuso para la Escuela de Artes y Oficios, y fue vicerrector y profesor en la Universidad de Antioquia. En 1893 fue nombrado Secretario de Instrucción Pública, desde donde se encargó de realizar importantes innovaciones en el campo académico tales como el establecimiento de las escuelas nocturnas, además de otorgar una ayuda anual de $500 a la Academia de Medicina. Otro de sus aportes relevantes fue la implementación de la enseñanza de telegrafía en la Escuela Normal de Señoritas. Debido a su cargo público nombró como rector de la Universidad de Antioquia a Eduardo Zuleta (su antecesor en este cargo). Posteriormente se le nombró rector de la Alma Máter en 1899, pero el mismo año se desató una guerra civil, lo que generó la suspensión de las actividades en el plantel. Uno de los aspectos más relevantes en su carrera fue su participación en la separación de Panamá. El 22 de enero de 1903 se firmó entre Herrán y un funcionario norteamericano, la autorización que otorgó territorio de Panamá a Estados Unidos para explotarlo, ofreciendo a cambio una suma de dinero a Colombia. Dicha negociación fue objeto de oposición del senado colombiano trayendo consigo disputas por la negación del tratado. Herrán murió el 30 de agosto de 1904 en Nueva York."
                    },

                    "media": {
                        "url": "img/rectores-xix/tomas-herran.jpg",
                        "caption": "Foto oficial del rector Tomás Herrán"
                        
                    }
                },

                {
                    "start_date": { "year": "1901" },
                    
                    "text": {
                        "headline": "Carlos Eugenio Restrepo Restrepo",
                        "text": "Rector de la Universidad de AntioquiaCarlos E. Restrepo nació en Medellín en 1867. Al inicio de sus estudios tuvo por compañeros a dos personajes que serian importantes en su futuro: Antonio José Uribe y Mariano Ospina. Posteriormente terminó sus estudios en el seminario diocesano, donde además de su formación académica también fue construyendo su ideal político. Más tarde trabajó en el bufete de su padre donde obtuvo prestigio por sus labores. Tiempo después se dedicó al trabajo periodístico en diarios como El Impulsor y La Unión, y en 1899 pasó a dirigir el periódico El Correo de Antioquia, medio de información de corte conservador, al cual apuntaba Restrepo. Al reabrirse la Universidad en 1901, Restrepo fue nombrado al frente de la rectoría. Incluso cuando recibió el nombramiento entregó al consejo y profesores el texto mediante el cual dio a conocer sus posturas respecto a la forma de manejar tanto el plantel como el aspecto académico. Tras su retiro del cargo realizó otras actividades, destacándose como miembro de la Academia Antioqueña de Historia. Carlos Eugenio Restrepo fue nombrado presidente de la república entre 1910 y 1914. De esta forma, entre muchos otros movimientos políticos, intelectuales y sociales en los que participó, puede decirse que la figura de Carlos E. Restrepo es importante para la ciudad, y tanto más para la Universidad de Antioquia. Luego de su muerte el 6 de julio de 1937, su familia donó al claustro universitario parte de su obra escrita."
                    },

                    "media": {
                        "url": "img/rectores-xx/carlos-eugenio-restrepo.jpg",
                        "caption": "Foto oficial del rector Carlos Eugenio Restrepo Restrepo"
                        
                    }
                },

                {
                    "start_date": { "year": "1902" },
                    "end_date": { "year": "1904" },
                    "text": {
                        "headline": "Tomás J. Bernal",
                        "text": "Tomás Bernal nació en el municipio de La Ceja (Antioquia) en 1852. Su primera formación académica comenzó en Marinilla, y posteriormente continuó sus estudios en la Universidad de Antioquia donde obtuvo el título en Medicina. Al finalizar su carrera se dedicó a complementar sus estudios en París, donde se destacó, e incluso ganó concursos de anatomía. Al regresar a Colombia, ejerció en Medellín como profesor de anatomía, ciencias naturales, botánica y zoología. Durante su periodo rectoral la Alma Máter atravesó una crisis financiera importante que llevó a que algunos profesores se ofrecieran a dictar sus cursos gratis. Bernal se encargó de la rectoría de la Institución durante dos años, hasta 1904 cuando fue reemplazado por el señor Tulio Ospina Vásquez."
                    },

                    "media": {
                        "url": "img/rectores-xx/.jpg",
                        "caption": "Foto oficial del rector Tomás J. Bernal"
                        
                    }
                },

                {
                    "start_date": { "year": "1904" },
                    "end_date": { "year": "1911" },
                    "text": {
                        "headline": "Tulio Ospina Vásquez",
                        "text": "Este ingeniero, historiador y científico nació en Medellín en 1857. Hijo de Mariano Ospina Rodríguez, presidente de la Confederación Granadina entre 1857 y 1861. Desde muy pequeño fue llevado a Guatemala, debido a que tuvo que salir del país junto con su familia tras la caída del gobierno liderado por su padre. Estando allí fue educado por religiosos de la Compañía de Jesús. Regresó a Medellín en 1882 y en la capital antioqueña continuó sus estudios en la Universidad de Antioquia. Tiempo después se vinculó al ejército del Partido Conservador como capitán de batallón durante la Guerra Civil de 1885. Otra de las actividades a las que se dedicó fue al estudio de la ingeniería de minas en la Universidad de Berkeley, en Costa Rica. A su regreso a Medellín, tanto Tulio como su hermano Pedro Nel formaron parte de la rectoría de la Escuela Nacional de Minas de Medellín, siendo los primeros rectores de esa institución. Ya en 1904, Ospina se posesionó como rector de la Universidad de Antioquia, gracias al llamado hecho por el gobernador Benito Uribe Gómez. Debido a la precaria situación económica de la Universidad, Ospina solicitó la impartición de clases gratuitas. Esta situación causó el cierre de algunas facultades y de las asignaturas de medicina, latín y filosofía, puesto que se pensó en la necesidad de implementar carreras más prácticas como la ingeniería, incluso proyectando las materias que se debían cursar en las diferentes escuelas de agronomía, minas y comercio. Otra modificación sufrida en la Universidad fue la implementación de la Escuela de Bachillerato Técnico. Ospina dejó de lado “las dos secciones de enseñanza secundaria” de la Institución: la Escuela de Filosofía y Letras y el Liceo Antioqueño, creado en 1901. No obstante en 1908, siendo aún Ospina rector, el liceo fue reabierto. En cuanto a la Escuela de Minas, de la cual Ospina fue cofundador, rector y profesor, ésta fue reincorporada como anexa a la Universidad de Antioquia entre 1906 y 1911, cuando Ospina se retira de la Universidad, y la Escuela pasa a ser de nuevo una entidad independiente. Ospina murió en Panamá, el 17 de febrero de 1921."
                    },

                    "media": {
                        "url": "img/rectores-xx/.jpg",
                        "caption": "Foto oficial del rector Tulio Ospina Vásquez"
                        
                    }
                },

                {
                    "start_date": { "year": "1911" },
                    "end_date": { "year": "1913" },
                    "text": {
                        "headline": "José María Escobar",
                        "text": "José María Escobar nació en Medellín en 1855. Este personaje estuvo al frente de la Universidad de Antioquia durante dos años, durante su periodo se creó la revista Estudios de Derecho. Además, Escobar ocupó algunos cargos en la esfera pública que le dieron reconocimiento político al ser miembro del concejo municipal, rector de la Escuela Nacional de Minas, secretario departamental de hacienda y catedrático universitario en la Escuela de Minas y la Universidad de Antioquia. Luego de terminado su periodo rectoral fue reemplazado por Miguel María Calle."
                    },

                    "media": {
                        "url": "img/rectores-xx/jose-maria-escobar.jpg",
                        "caption": "Foto oficial del rector José María Escobar"
                        
                    }
                },

                {
                    "start_date": { "year": "1913" },
                    "end_date": { "year": "1921" },
                    "text": {
                        "headline": "Miguel María Calle",
                        "text": "Miguel María Calle nació en 1877 en Abejorral (Antioquia). Sus primeros estudios los realizó en su pueblo natal, aunque tiempo después se trasladó hasta Manizales donde terminó algunos cursos en el Colegio Santo Tomas de Aquino. En 1892 ingresó a la Universidad de Antioquia para estudiar Literatura, y en 1895 obtuvo su título en Filosofía y Letras. Un año después, comenzó sus estudios en Ciencias Naturales y Medicina. Ejerció laboralmente en diferentes lugares del departamento, como por ejemplo una empresa minera en el municipio de Titiribí, donde se encargó del servicio médico. Uno de los campos en donde más se destacó fue su faceta como docente, pues trabajó por largo tiempo como profesor de la Facultad de Medicina, e incluso, ya como rector, pensó que era necesario contar con un edificio adecuado para brindar una educación óptima, escogiendo entonces el que había sido construido para la Escuela Normal. Esta idea derivó en que en 1913 se iniciara la reforma al edificio junto con el salón de grados, ubicado actualmente en el Paraninfo. No obstante, la estructura material no solo fue el centro de los cambios realizados por Calle, también hubo dos importantes innovaciones: algunos estatutos que presentaban incongruencia fueron modificadas, y por otro lado, la separación de las facultades de Derecho y Medicina, para que éstas empezaran a funcionar independientemente de la Universidad. En 1919 renunció al cargo de rector, pero Jesús Antonio Hoyos, su sucesor, no se presentó, y Calle fue llamado a continuar al frente de la rectoría hasta su retiro en 1921. Murió en Medellín en 1957."
                    },

                    "media": {
                        "url": "img/rectores-xx/miguel-maria-calle.jpg",
                        "caption": "Foto oficial del rector Miguel María Calle"
                        
                    }
                },

                {
                    "start_date": { "year": "1921" },
                    
                    "text": {
                        "headline": "Emilio Robledo",
                        "text": "Nació en 1875 en Salamina, Caldas, donde también cursó sus estudios. Más tarde viajó a Manizales y en 1893 llegó a la Universidad de Antioquia donde su hermano fungía como secretario. Cursó su educación superior en la Facultad de Medicina donde se graduó en 1900, aunque desde 1895 se desempeñaba como tesorero y profesor en la Universidad. Durante su rectoría implementó las cátedras de deontología médica e historia de la medicina en dicha facultad. Se retiró del cargo en abril de 1922, y en 1925 fue reelegido rector. Murió en Bogotá en 1961."
                    },

                    "media": {
                        "url": "img/rectores-xx/emilio-robledo.jpg",
                        "caption": "Foto oficial del rector Emilio Robledo"
                        
                    }
                },

                {
                    "start_date": { "year": "1922" },
                    "end_date": { "year": "1923" },
                    "text": {
                        "headline": "Antonio Mauro Giraldo",
                        "text": "Antonio Giraldo nació en1862 en El Peñol (Antioquia). Sus primeros estudios los realizó en el mismo lugar, no obstante se trasladó a Medellín para continuar en el Colegio Central de la Universidad, donde posteriormente realizó estudios en Medicina. Por otro lado. en 1885 participó en la guerra bajo las fuerzas conservadoras. Más tarde continuó con su formación académica en el Colegio Mayor de Nuestra Señora del Rosario y en la Escuela Nacional de Medicina, de donde se graduó en 1892. Ejerció algunas labores como catedrático en Rionegro y Medellín, representante al Congreso y diputado a la Asamblea Departamental de Antioquia. Fue el primer médico en Antioquia en realizar trepanación de cráneo sin anestesia. Durante su periodo rectoral se creó el Hospital San Juan de Dios, una policlínica que dependía científica y administrativamente de la Escuela de Medicina y del Hospital San Vicente de Paúl. Estuvo al frente de la Institución hasta 1923, año en el que asumió el cargo por segunda vez Emilio Robledo. Murió en 1958."
                    },

                    "media": {
                        "url": "img/rectores-xx/antonio-mauro-giraldo.jpg",
                        "caption": "Foto oficial del rector Antonio Mauro Giraldo"
                        
                    }
                },

                {
                    "start_date": { "year": "1925" },
                    "end_date": { "year": "1928" },
                    "text": {
                        "headline": "Emilio Robledo",
                        "text": "Robledo asumió como rector por primera vez entre 1921 y 1922. Fue reelegido en este cargo para el período 1925-1928. Durante su segundo periodo rectoral se inaugura el edificio de la antigua sede de la Facultad de Derecho, que actualmente sigue funcionando como edificio anexo a la Alma Máter en el centro de la ciudad de Medellín."
                    },

                    "media": {
                        "url": "img/rectores-xx/emilio-robledo.jpg",
                        "caption": "Foto oficial del rector Emilio Robledo"
                        
                    }
                },

                {
                    "start_date": { "year": "1928" },
                    "end_date": { "year": "1934" },
                    "text": {
                        "headline": "Pbro. Manuel José Sierra",
                        "text": "Nació en Girardota en 1885, y allí cursó sus primeros estudios. En 1899 ingresó al seminario de Medellín de donde se ordenó sacerdote en 1903. Su actividad está ligada principalmente a la creación y participación como primer rector de la Universidad Pontificia Bolivariana. Asumió la rectoría de la Universidad de Antioquia en 1928, donde realizó reformas a la biblioteca, hecho que causó grandes pérdidas en el material almacenado en esta dependencia. Durante su rectoría se presentó una protesta por parte de los estudiantes de la Facultad de Derecho en contra de sus preceptos. Por iniciativa del Carlos Cock, gobernador del departamento, y del rector Sierra, se creó la Escuela Dental, que más adelante se convirtió en la Facultad de Odontología. Durante su rectoría la Universidad de Antioquia recibió por primera vez en mujeres eb sus aulas. En 1931 cuatro damas se matricularon en la Escuela Dental. Además, es necesario resaltar que de cierta forma la creación de este claustro católico tiene relación con la Universidad de Antioquia, puesto que como lo menciona Gildardo Lotero Orozco “los fundadores de la UPB simbolizaron su dimisión de la Universidad de Antioquia y la creación de una universidad distinta donde pudieran vivir su fe católica y practicar su moral sin intolerancias ni exclusivismos”. El presbítero Manuel J. Sierra murió en Medellín en 1941."
                    },

                    "media": {
                        "url": "img/rectores-xx/manuel-jose-sierra.jpg",
                        "caption": "Foto oficial del rector Pbro. Manuel José Sierra"
                        
                    }
                },

                {
                    "start_date": { "year": "1934" },
                    "end_date": { "year": "1938" },
                    "text": {
                        "headline": "Clodomiro Ramírez",
                        "text": "Clodomiro Ramírez nació en Abejorral en 1869, y cursó estudios en derecho y ciencias políticas. Posteriormente ejerció en importantes y numerosos campos, tanto académicos como políticos, en los que sobresalen: profesor de la Universidad de Antioquia, gobernador de Antioquia en dos oportunidades (1903-1904 y 1912-1913), miembro de las academias de Ciencias Políticas de París y de Derecho Internacional de Estados Unidos, así como de la Academia de Historia Antioqueña. Durante su gestión como rector de la Universidad de Antioquia impulsó la extensión universitaria y el fortalecimiento académico de la Institución. Para mejorar la situación financiera de la Alma Máter, el rector Ramírez creó el Fondo Acumulativo Universitario, que contó con el apoyo de diferentes entidades públicas y privadas. Por otro lado, en el ámbito político estableció relación con el señor Carlos E. Restrepo cuando éste estuvo en la presidencia y el primero como ministro de gobierno. Además fue juez en Abejorral, secretario de hacienda, diputado y senador de la república. Estuvo a la cabeza de la Universidad de Antioquia durante un periodo de cuatro años, retirándose del cargo en 1938. Falleció dos años después, el 17 de septiembre de 1940."
                    },

                    "media": {
                        "url": "img/rectores-xx/clodomiro-ramirez.jpg",
                        "caption": "Foto oficial del rector Clodomiro Ramírez"
                        
                    }
                },

                {
                    "start_date": { "year": "1938" },
                    "end_date": { "year": "1942" },
                    "text": {
                        "headline": "Ricardo Uribe Escobar",
                        "text": "Ricardo Uribe Escobar nació en Medellín en 1892. Realizó sus estudios en el Colegio de San Ignacio donde se graduó de bachiller en Filosofía y Letras. Posteriormente continúo su carrera en el campo del derecho, logrando su título de doctor en Derecho de la Universidad de Antioquia. Fue uno de los primeros hombres que desde la academia local trató el tema de los derechos de la mujer ante la ley en su tesis para optar a grado de Doctor en Jurisprudencia y Ciencias Políticas, titulada 'Notas Feministas'. Más tarde se vinculó a la Universidad de Antioquia como docente en la Facultad de Derecho y Ciencias Políticas. Otros cargos relevantes que ocupó fueron: presidente del consejo de estado, cofundador de la Universidad de Medellín en 1950, fundador del diario El Correo Liberal, secretario de gobierno, y designado a la presidencia de la república. Murió en Medellín en 1968."
                    },

                    "media": {
                        "url": "img/rectores-xx/ricardo-uribe-escobar.jpg",
                        "caption": "Foto oficial del rector Ricardo Uribe Escobar"
                        
                    }
                },

                {
                    "start_date": { "year": "1942" },
                    
                    "text": {
                        "headline": "Julio César García",
                        "text": "Julio César García, nació en Bogotá en 1894. Se graduó como bachiller en el Colegio Mayor de Nuestra Señora del Rosario en Bogotá, con el título en Filosofía y Letras. Posteriormente se dedicó principalmente a la docencia, ejerciendo en diferentes lugares como la Escuela Normal de Varones y el Liceo Antioqueño, del que también fue rector en 1940. En 1943 fue elegido para ocupar el cargo de rector de la Universidad de Antioquia. Desde siempre se había interesado por los museos, y al asumir el cargo promovió estudios arqueológicos y antropológicos con la intención de crear el museo arqueológico de la Universidad. Además de ello, también estuvo al frente de otros cargos como diputado a la asamblea de Antioquia y fundó el periódico conservador La Defensa. Murió en Medellín en 1959."
                    },

                    "media": {
                        "url": "img/rectores-xx/julio-cesar-garcia.jpg",
                        "caption": "Foto oficial del rector Julio César García"
                        
                    }
                },

                {
                    "start_date": { "year": "1943" },
                 
                    "text": {
                        "headline": "Fidel Rodríguez",
                        "text": "Fidel Rodríguez nació en 1909. Realizó sus estudios en el Liceo de la Universidad de Antioquia. Posteriormente, se dedicó al derecho en la Alma Máter, especializándose en derecho civil y comercial. Igualmente ejerció como profesor en la Facultad de Derecho y como rector de la Universidad en 1943. Su rectoría marcó el inicio de la Escuela de Ciencias químicas que dio origen a la Facultad de Ingeniería. También fueron establecidas la Escuela de Farmacia y el Instituto de Filología."
                    },

                    "media": {
                        "url": "img/rectores-xx/.jpg",
                        "caption": "Foto oficial del rector Fidel Rodríguez"
                        
                    }
                },

                {
                    "start_date": { "year": "1944" },
                    "end_date": { "year": "1946" },
                    "text": {
                        "headline": "Hernán Posada González",
                        "text": "Hernán Posada González nació en 1901. Este médico además de ser decano de la Facultad de Medicina, también asumió la rectoría de la Universidad de Antioquia. Durante su periodo rectoral, Posada se destacó principalmente por crear el Departamento de Extensión Cultural, dependencia que hasta la fecha es la encargada de las actividades y promoción cultural de la Universidad."
                    },

                    "media": {
                        "url": "img/rectores-xx/hernan-posada.jpg",
                        "caption": "Foto oficial del rector Hernán Posada González"
                        
                    }
                },

                {
                    "start_date": { "year": "1946" },
                    "end_date": { "year": "1948" },
                    "text": {
                        "headline": "Gil J. Gil Madrigal",
                        "text": "Gil Juvenal Gil nació en Yarumal en 1884. Estudió bachillerato en la Universidad de Antioquia, de donde se graduó en Filosofía y Letras. Estudio medicina en la misma institución, pero debido al cierre de la Universidad entre 1905 y 1910 continuó con sus estudios en la Universidad de Columbia, donde se graduó como médico en 1907. Tras terminar su carrera regresó a Medellín donde trabajó como profesor y decano de la Facultad de Medicina. Fue también jefe de clínica y rector de la Universidad entre 1947 y 1948. Fue también miembro de diversas academias de medicina y presidente de la Sociedad de Mejoras Públicas de Medellín. Considerado como maestro de la cirugía antioqueña, realizó más de diez mil intervenciones quirúrgicas con porcentaje mínimo de mortalidad. En 1919 fundó en Medellín la primera clínica particular de Antioquia. Murió en Medellín en 1948."
                    },

                    "media": {
                        "url": "img/rectores-xx/.jpg",
                        "caption": "Foto oficial del rector Gil J. Gil Madrigal"
                        
                    }
                },

                {
                    "start_date": { "year": "1948" },
                    "end_date": { "year": "1953" },
                    "text": {
                        "headline": "Gustavo Uribe Escobar",
                        "text": "Nació en Medellín en 1888. Realizó sus estudios en el colegio San Ignacio y posteriormente en la Universidad de Antioquia donde cursó medicina. Más tarde viajó a Barcelona donde culminó su educación superior. Fue profesor en la Facultad de Medicina donde dictaba clases dermatología y anatomía patológica. Asumió el cargo de rector entre 1948 y 1953, no obstante existe muy poca información sobre su administración. Durante su periodo rectoral se establece el examen de admisión como requisito indispensable para ingresar a la Universidad de Antioquia. Otras labores a las que se dedicó Escobar fueron: jefe del laboratorio departamental, secretario de la delegación de Colombia en Bélgica, presidente de la Academia de Medicina de Medellín y colaborador de la Cruz Roja. Murió en 1972."
                    },

                    "media": {
                        "url": "img/rectores-xx/gustavo-uribe-escobar.jpg",
                        "caption": "Foto oficial del rector Gustavo Uribe Escobar"
                        
                    }
                },

                {
                    "start_date": { "year": "1953" },
                    "end_date": { "year": "1955" },
                    "text": {
                        "headline": "Alberto Bernal Nicholls",
                        "text": "Alberto Bernal Nicholls nació en Medellín en 1900. Sus estudios iniciales los realizó en el Colegio San Ignacio y más tarde estudió medicina en la Universidad de Antioquia, institución de la que posteriormente fue rector. Durante su periodo rectoral el gobierno departamental creó el Bachillerato Nocturno de la Universidad de Antioquia y la Biblioteca General de la Alma Máter, considerada como la segunda mejor del país, después de la Biblioteca Nacional. Entre algunos de los cargos ejercidos por Bernal se destacan su participación en la junta directiva del Hospital San Vicente de Paul, fue miembro de la Academia de Medicina de Medellín así como de la Academia Colombiana de Medicina. Se retiró del cargo en 1955 y falleció en Medellín en 1982."
                    },

                    "media": {
                        "url": "img/rectores-xx/alberto-bernal.jpg",
                        "caption": "Foto oficial del rector Alberto Bernal Nicholls"
                        
                    }
                },

                {
                    "start_date": { "year": "1955" },
                    "end_date": { "year": "1957" },
                    "text": {
                        "headline": "Samuel Barrientos Restrepo",
                        "text": "Nació en Fredonia (Antioquia) en 1908. Realizó sus estudios en el Colegio Mayor de Nuestra Señora del Rosario, los cuales culminó en 1927 cuando se graduó como abogado. Su periodo rectoral en la Universidad de Antioquia se destacó principalmente por la creación de un nuevo edificio para el Liceo Antioqueño ubicado en el barrio Robledo. Además, junto con Ignacio Vélez Escobar, fundó la Escuela Interamericana de Bibliotecología. Fue Secretario de Educación, diputado a la Asamblea de Antioquia, magistrado de la Sala Penal del Tribunal Superior de Medellín y fundador del Liceo Marco Fidel Suárez. Murió en Medellín en 1980."
                    },

                    "media": {
                        "url": "img/rectores-xx/samuel-barrientos-restrepo.jpg",
                        "caption": "Foto oficial del rector Samuel Barrientos Restrepo"
                        
                    }
                },

                {
                    "start_date": { "year": "1958" },
                    
                    "text": {
                        "headline": "Gonzalo Restrepo Jaramillo",
                        "text": "Gonzalo Restrepo Jaramillo nació en Medellín en 1895. Estudió en la Universidad de Antioquia donde obtuvo el título en Derecho y Ciencias Políticas, tras lo cual cursó una especialización en Estados Unidos. A su regreso a Medellín ejerció como profesor en la Alma Máter, en la Escuela Nacional de Minas y en la Escuela de Derecho de la Universidad Pontificia Bolivariana. Durante su periodo rectoral la Escuela Interamericana de Bibliotecología abrió sus puertas a la primera promoción de estudiantes de diferentes países de América Latina, y el Consejo Directivo de la Universidad aprobó los contratos para la construcción de los nuevos edificios y campos deportivos del Liceo Universitario. Fue también concejal, senador, diputado a la Asamblea de Antioquia, gerente del Banco Alemán Antioqueño y embajador de Colombia en Washington. Murió en 1966."
                    },

                    "media": {
                        "url": "img/rectores-xx/.jpg",
                        "caption": "Foto oficial del rector Gonzalo Restrepo Jaramillo"
                        
                    }
                },

                {
                    "start_date": { "year": "1958" },
                    
                    "text": {
                        "headline": "Alberto Gómez Arango",
                        "text": "Médico y cirujano nacido en Medellín en 1903. A partir de 1927 se desempeñó como docente de áreas como técnica quirúrgica, higiene y patología general. Fue miembro de la Sociedad Médico Quirúrgica de Hospitales en Bogotá. Fungió también como médico de asistencia pública en Medellín y decano encargado de la Facultad de Medicina. Durante su periodo rectoral se dio inicio al programa de bacteriología. Realizó diversas visitas a principales centros quirúrgicos de New york, Chicago, Madrid y París, entre otros. Murió en 1997."
                    },

                    "media": {
                        "url": "img/rectores-xx/alberto-gomez-arango.jpg",
                        "caption": "Foto oficial del rector Alberto Gómez Arango"
                        
                    }
                },

                {
                    "start_date": { "year": "1958" },
                   
                    "text": {
                        "headline": "José Manuel Mora Vásquez",
                        "text": "José Manuel Mora nació en Medellín en 1896. Sus primeros estudios los hizo en la escuela de las hermanas de la caridad, y los secundarios en el Colegio de los Jesuitas en Medellín. Más tarde se graduó como abogado en la Escuela de Derecho de la Universidad de Antioquia, donde también ejerció profesor y decano. Fue también docente en la Universidad Pontificia Bolivariana y en la Facultad de Minas de la Universidad Nacional. Fiscal superior, Secretario de Hacienda de Antioquia y magistrado del Tribunal Superior fueron otros de los cargos que desempeñó. Asumió como rector entre 1958 y 1959. Murió en Medellín en 1991 a los 95 años."
                    },

                    "media": {
                        "url": "img/rectores-xx/jose-manuel-mora-vasquez.jpg",
                        "caption": "Foto oficial del rector José Manuel Mora Vásquez"
                        
                    }
                },

                {
                    "start_date": { "year": "1959" },
                    
                    "text": {
                        "headline": "Iván Correa Arango",
                        "text": "Iván Correa nació en Medellín en 1916, y realizó sus estudios en el Liceo Antioqueño. Sus estudios superiores los realizó también en esta institución, de donde se graduó en Derecho y Economía. Durante su administración la Asamblea Departamental creó la Escuela de Periodismo de la Universidad de Antioquia, la cual funcionó en sus primeros años como una dependencia de la Facultad de Educación. Correa también ejerció como profesor, abogado del Ministerio de Hacienda, secretario general de la Presidencia de la República, presidente del Banco Industrial Colombiano y vicepresidente de la Compañía Colombiana de Tabaco. Cabe anotar que Iván Correa es el rector más joven que ha tenido la Universidad de Antioquia, con tan solo 43 años."
                    },

                    "media": {
                        "url": "img/rectores-xx/ivan-correo-arango.jpg",
                        "caption": "Foto oficial del rector Iván Correa Arango"
                        
                    }
                },

                {
                    "start_date": { "year": "1961" },
                    
                    "text": {
                        "headline": "Jaime Sanín Echeverri",
                        "text": "Jaime Sanín nació en 1922 en Rionegro. Durante su educación inicial pasó por el seminario de los jesuitas, sin embargo no culminó su preparación vocacional como sacerdote. Estudió derecho en la Universidad Pontificia Bolivariana, a pesar de que se dedicó principalmente al periodismo y la literatura. Sanín se destacó como periodista en algunos de los diarios más importantes del país, fue fundador de algunos medios de comunicación y lo hizo famoso la novela titulada 'Una mujer de cuatro en conducta' publicada en 1948 y llevada tiempo después a teatro y televisión. Desde 1953 fue profesor de economía en la Facultad de Ciencias Económicas de la Alma Máter y fue elegido rector de la Universidad de Antioquia en 1961. Durante su periodo rectoral la Asamblea Departamental aprobó la venta del Ferrocarril de Antioquia a la nación, con lo cual se destinaron 25 millones de pesos para la construcción de la Ciudad Universitaria. Este destacado abogado y periodista ocupó diversos cargos públicos de renombre, fue director del SENA, estuvo al frente de la Asociación Colombiana de Universidades y rector de la Universidad Pedagógica de Bogotá. Además perteneció a la Academia Colombiana de la Lengua.Murió en Bogotá en 2008."
                    },

                    "media": {
                        "url": "img/rectores-xx/jaime-sanin-echeverri.jpg",
                        "caption": "Foto oficial del rector Jaime Sanín Echeverri"
                        
                    }
                },

                {
                    "start_date": { "year": "1963" },
                    "end_date": { "year": "1965" },
                    "text": {
                        "headline": "Ignacio Vélez Escobar",
                        "text": "Ignacio Vélez nació en 1918. Estudió medicina y cirugía en la Universidad de Antioquia, y posteriormente en Estados Unidos, donde cursó su especialización. Fue profesor de la Facultad de Medicina de la Alma Máter y al poco tiempo fue elegido como decano. En cuanto a su participación en la vida social y política se destacó como concejal de Medellín, gobernador de Antioquia y senador de la República. En 1963 asumió el cargo de rector de la Universidad de Antioquia hasta 1965. Es relevante mencionar que fue el principal generador de la idea de llevar a cabo la construcción de la Ciudad Universitaria, para ello recibió ayudas económicas de entidades como Kellogg Company y Rockefeller, así como un préstamo por parte del Banco Interamericano de Desarrollo – BID- . Durante su periodo rectoral se implementó una política de modernización de la Universidad que privilegió la departamentalización, el desarrollo de las ciencias básicas y de los estudios generales, el surgimiento de nuevas carreras y la organización de materias por créditos. Otra contribución importante de Escobar fue la creación de la Escuela Nacional de Salud Pública, que inicialmente funcionaría como una dependencia de la Facultad de Medicina. En los últimos años de su vida decidió retirarse de la escena política a la cual pertenecía como uno de los líderes conservadores de Antioquia. Falleció en 2011 en Sabaneta, Antioquia."
                    },

                    "media": {
                        "url": "img/rectores-xx/ignacio-velez.jpg",
                        "caption": "Foto oficial del rector Ignacio Vélez Escobar"
                        
                    }
                },

                {
                    "start_date": { "year": "1965" },
                    "end_date": { "year": "1969" },
                    "text": {
                        "headline": "Lucrecio Jaramillo Vélez",
                        "text": "Lucrecio Jaramillo Vélez nació en Medellín en 1915. Realizó sus estudios en derecho y fue profesor distinguido de la misma facultad. Siendo profesor de la Alma Máter fue elegido como decano de la Facultad de Derecho para el periodo 1964-1965, cargo que le permitió instaurar el Consultorio Jurídico, como un servicio ofrecido por los estudiantes y profesores a la comunidad en general. Para 1965 fue elegido para ocupar el cargo de rector de la Universidad de Antioquia, luego de que el Consejo Superior Universitario aceptara la renuncia del profesor Ignacio Vélez Escobar. Durante su periodo rectoral, Jaramillo debió asumir el periodo final de la construcción del campus principal de la Institución, conocido como Ciudad Universitaria, así como su inauguración en 1969. Como rector asumió las movilizaciones de estudiantes de la Institución y de otros universitarios de la ciudad que protestaban en contra del Plan Básico de la Educación Superior. Jaramillo estuvo al frente de la Universidad de Antioquia hasta 1969, y falleció en 1972."
                    },

                    "media": {
                        "url": "img/rectores-xx/lucrecio-jaramillo-velez.jpg",
                        "caption": "Foto oficial del rector Lucrecio Jaramillo Vélez"
                        
                    }
                },

                {
                    "start_date": { "year": "1970" },
                    
                    "text": {
                        "headline": "Eduardo Uribe Botero",
                        "text": "Eduardo Uribe nació en La Ceja, Antioquia, en 1910 y allí mismo realizó sus estudios. Posteriormente se trasladó a Rionegro y culminó su bachillerato en el colegio San Ignacio de Medellín, en 1929. Más tarde estudió derecho en la Universidad de Antioquia. Uribe tuvo una amplia participación política en diferentes campos como secretario de gobierno, representante a la cámara, ministro de gobierno, y embajador de Colombia en Washington, cargo desde el cual, en relación con el Banco Interamericano de Desarrollo, fue posible un empréstito para la construcción de la Ciudad Universitaria. Este abogado estuvo al frente de la Universidad de Antioquia como rector en un periodo fugaz de ocho meses. Uribe Botero falleció en Medellín, el 16 de enero de 1973."
                    },

                    "media": {
                        "url": "img/rectores-xx/.jpg",
                        "caption": "Foto oficial del rector Eduardo Uribe Botero"
                        
                    }
                },

                {
                    "start_date": { "year": "1970" },
                    
                    "text": {
                        "headline": "Samuel Bernardo Syro Giraldo",
                        "text": "Samuel Bernardo Syro nació en Rionegro en 1924. Fue profesor y decano en la Facultad de Ciencias Económicas de la Universidad. Syro ocupó el cargo de rector de la Alma Máter en 1970 y junto con el gobernador Diego Calle y Efraín Vélez, enfrentaron el movimiento estudiantil de 1971. El movimiento estudiantil de la Universidad se fortaleció e hizo sentir su inconformidad con la intervención de las fundaciones norteamericanas en las universidades del país, e igualmente manifestó su rechazo por la guerra de Vietnam. La Asociación de profesores de la Universidad de Antioquia expresó públicamente su respaldo a la causa estudiantil. Este asunto coyuntural dentro de su periodo rectoral derivó en el retiro de Syro Giraldo. Además de ser rector de la Institución, Syro fue senador de la república y alcalde de Medellín."
                    },

                    "media": {
                        "url": "img/rectores-xx/samuel-syro-giraldo.jpg",
                        "caption": "Foto oficial del rector Samuel Bernardo Syro Giraldo"
                        
                    }
                },

                {
                    "start_date": { "year": "1971" },
                    
                    "text": {
                        "headline": "Hector Guillermo William Rojas Montoya",
                        "text": "Hijo de Francisco Rojas y Carolina Montoya, William Rojas nació en La Estrella, Antioquia, el 30 de diciembre de 1929. Realizó sus estudios en medicina en la Universidad de Antioquia, de donde se graduó con tesis laureada en 1955. Realizó su especialización en medicina interna en la Universidad de Pensylvania (Estados Unidos) y en el Hospital Hammersmith de Londres. Fue profesor de la Alma Máter en el campo de medicina interna, así coordinador de esta línea en de la Facultad de Medicina. También ejerció como director ejecutivo de la misma facultad. En 1971 tomó el cargo como rector de la Universidad de Antioquia. Sin embargo, su paso por la dirección de la Institución estuvo marcado por un momento coyuntural en la consolidación de una de las manifestaciones más importantes del movimiento estudiantil. Se produjo una asonada en contra del rector William Rojas, quien fue obligado a salir de su oficina. Pocos días después se ordenó la expulsión de los estudiantes responsables, decisión que despertó la solidaridad del estudiantado lo que conllevó a la suspensión de las sanciones. Aún así, las labores académicas fueron suspendidas durante el resto de ese año."
                    },

                    "media": {
                        "url": "img/rectores-xx/.jpg",
                        "caption": "Foto oficial del rector Hector Guillermo William Rojas Montoya"
                        
                    }
                },

                {
                    "start_date": { "year": "1972" },
                    "end_date": { "year": "1974" },
                    "text": {
                        "headline": "Luis Fernando Duque Ramírez",
                        "text": "Luis Fernando Duque nació en Bogotá el 19 de junio de 1939. Cursó la primaria en el colegio de la Universidad Pontificia Bolivariana, la secundaria en el colegio San José y sus estudios universitarios en la Universidad de Antioquia, donde se graduó como médico y cirujano. Fue en la Alma Máter donde comenzó integrando el personal docente en la Escuela de Salud Pública. También se destaca su participación en el Congreso Mundial de Ginecología en New York. En 1972 fue designado por el gobernador para ejercer como rector encargado de la universidad, y ya como rector en propiedad un año después. Durante su administración se reiniciaron los paros profesorales y estudiantiles durante la segunda semana de abril. Las protestas estaban relacionadas con la precaria situación financiera de la Universidad y la poca atención que el gobierno le presta a los reclamos del magisterio oficial. Además, la inconformidad de la comunidad universitaria se manifestó por medio de la creación de una alianza entre el movimiento estudiantil y un grupo de profesores, con el objetivo de enfrentar la política de mano dura del rector Luis Fernando Duque Ramírez. En septiembre de 1974 envió una carta dirigida al gobernador, donde presenta su renuncia justificando que su “retiro de la rectoría es un hecho que facilitaría la solución de los problemas actuales, provocados por los primeros” (el personal docente). Sin embargo le fue solicitado que permaneciera al frente como apoyo al tomar posesión el nuevo rector. Murió en agosto de 2013."
                    },

                    "media": {
                        "url": "img/rectores-xx/luis-fernando-duque-ramirez.jpg",
                        "caption": "Foto oficial del rector Luis Fernando Duque Ramírez"
                        
                    }
                },

                {
                    "start_date": { "year": "1975" },
                    
                    "text": {
                        "headline": "Bernardo Trujillo Calle",
                        "text": "Bernardo Trujillo nació en Venecia, Antioquia, en 1928. Sus estudios los realizó en la Universidad de Antioquia donde se graduó en 1957 como abogado. En 1975 ocupó el cargo de rector de la Universidad de Antioquia, donde tuvo que afrontar –al igual que sus antecesores cercanos– la crisis política y social por la que pasaba la Institución en medio de protestas. Durante su administración se organizaron paros y protestas por las dificultades presupuestales que afectaban a la Institución y por las medidas de fuerza a las que son sometidos estudiantes y profesores. Fue también alcalde de Medellín, diputado de la Asamblea de Antioquia y de la Cámara de Representantes, así como presidente del Consejo Municipal. Además fue cofundador de la Universidad Autónoma Latinoamericana."
                    },

                    "media": {
                        "url": "img/rectores-xx/bernardo-trujillo-calle.jpg",
                        "caption": "Foto oficial del rector Bernardo Trujillo Calle"
                        
                    }
                },

                {
                    "start_date": { "year": "1977" },
                    
                    "text": {
                        "headline": "Jorge Elías Peláez Vallejo",
                        "text": "Jorge Elías Peláez nació en 1943. Médico de la Universidad Javeriana con una especialización en Administración de Atención Médica y Hospitalaria de la Universidad de Antioquia. Durante esta década la Universidad debió asumir cambios muy drásticos debido a las diversas problemáticas y dinámicas que se estaban presentando en la Institución, y que estaban relacionadas con las inconformidades de los miembros de la comunidad universitaria. Esta inestabilidad también se vería reflejada en la dirección de la Universidad, la cual fue ocupada por una cantidad importante de rectores durante periodos muy cortos. Tal fue el caso del profesor Peláez, quien asumió la rectoría a principios de 1977, y en septiembre del mismo año presentó su carta de renuncia. Peláez Vallejo fue también docente de tiempo completo en la Facultad Nacional de Salud Pública, así como médico rural, director del Hospital Regional de Oriente y director del Hospital Universitario San Vicente de Paúl."
                    },

                    "media": {
                        "url": "img/rectores-xx/jorge-elias-pelaez-vallejo.jpg",
                        "caption": "Foto oficial del rector Jorge Elías Peláez Vallejo"
                        
                    }
                },

                {
                    "start_date": { "year": "1979" },
                    
                    "text": {
                        "headline": "Luis Carlos Múñoz Uribe",
                        "text": "Luis Carlos Muñoz nació en Bello en 1939. Odontólogo y Magíster en Salud Pública de la Universidad de Antioquia, cursó la primaria en la escuela Cristóbal Colón y bachillerato en el Liceo Antioqueño. Muñoz fue nombrado rector en 1979, y durante su periodo al frente de la Institución se emitió el nuevo Estatuto General de la Universidad, siguiendo los parámetros de la reforma educativa nacional consignada en el Decreto 80 de 1980. Por los constantes conflictos estudiantiles, la Alma Máter cerró sus puertas durante un año. Además de su paso por la rectoría, fue jefe del Servicio Odontológico Juvenil, director de Asuntos Estudiantiles, jefe del Departamento de Odontología Preventiva y decano de la Facultad de Odontología. También ejerció como Viceministro de Educación, director del ICFES y fue fundador de la universidad CES."
                    },

                    "media": {
                        "url": "img/rectores-xx/luis-carlos-munoz-uribe.jpg",
                        "caption": "Foto oficial del rector Luis Carlos Múñoz Uribe"
                        
                    }
                },

                {
                    "start_date": { "year": "1981" },
                
                    "text": {
                        "headline": "Miguel Antonio Yepes Parra",
                        "text": "Nació en 1938 en Medellín. Su formación académica estuvo enfocada principalmente en el área de la salud. Estudió en el Liceo Antioqueño y medicina en la Universidad de Antioquia; posteriormente se especializó en dermatología en la Facultad Nacional de Salud Pública. Yepes Parra es reconocido por sus aportes a la academia como profesor en el postgrado de Protección Social de la Universidad CES, gestor y fundador de las Facultades de Medicina de la Fundación Universitaria San Martín y de la Corporación Universitaria Remington. Fue también asesor de otras instituciones como el Colegio Odontológico Colombiano, la Universidad de Santander, la Universidad de la Sabana y la Fundación Universitaria Luis Amigó, entre otras. En la Universidad de Antioquia, a parte del cargo de rector, ejerció como profesor de medicina y decano de la misma facultad. También fueron numerosos los cargos públicos que ocupó: gobernador de Antioquia, Ministro de Salud, de Educación y de Gobierno, y embajador de Colombia ante Cuba, entre otros."
                    },

                    "media": {
                        "url": "img/rectores-xx/antonio-yepes-parra.jpg",
                        "caption": "Foto oficial del rector Miguel Antonio Yepes Parra"
                        
                    }
                },

                {
                    "start_date": { "year": "1982" },
                    "end_date": { "year": "1988" },
                    "text": {
                       
                        "text": "Este periodo cuenta con rectores encagardados y no en propiedad debido a la situación de tensión por la que atrevesaba la Universidad"
                    }
                },

                {
                    "start_date": { "year": "1988" },
                    
                    "text": {
                        "headline": "Luis Javier Arroyave Morales",
                        "text": "Luis Javier Arroyave nació en Liborina, Antioquia, en 1947. Sus primeros estudios los realizó en la Escuela Urbana de Concepción y en la Institución Educativa Javiera Londoño. Cursó estudios superiores en la Universidad de Antioquia, de donde se graduó como médico veterinario. Además de asumir la rectoría en 1988, Arroyave ocupó diversos cargos dentro de la Universidad, entre los que se destacan: decano de la Facultad de Medicina Veterinaria y Zootecnia, vicerrector general (encargado), y jefe del Centro de Investigaciones Pecuarias. Fue también director de la Vicerrectoría Académica del Politécnico Colombiano Jaime Isaza Cadavid. Tras su retiro, fue llamada la profesora Beatriz Restrepo Gallego para asumir la rectoria de manera temporal, mientras se nombraba el nuevo rector. Arroyave continuó con su labor como profesor de tiempo completo, y en 1998 asumió nuevamente como decano de la Facultad de Ciencias Agrarias."
                    },

                    "media": {
                        "url": "img/rectores-xx/luis-javier-arroyave-morales.jpg",
                        "caption": "Foto oficial del rector Luis Javier Arroyave Morales"
                        
                    }
                },

                {
                    "start_date": { "year": "1989" },
                    
                    "text": {
                        "headline": "Luis Emilio Pérez Gutiérrez",
                        "text": "Luis Pérez nació en Cañasgordas, Antioquia, en 1952. Bachiller del Liceo Marco Fidel Suárez e ingeniero industrial de la Facultad de Minas de la Universidad Nacional, donde también cursó una Maestría en Matemáticas. Fue docente en la misma universidad, así como asistente de investigación en la Universidad de Michigan, gerente de la Beneficencia de Antioquia y EDA, y director de Planeación de Antioquia. Pérez Gutiérrez fue nombrado rector de la Universidad de Antioquia en 1989; sin embargo, su periodo no sería considerablemente largo, debido a su ideología liberal y la llegada del conservador Juan Gómez Martínez a la Gobernación de Antioquia durante su rectoría. Además se ha desempeñado en la escena política local ocupando cargos como alcalde de Medellín (2001-2003), Secretario de Educación, director del Instituto Colombiano para el Fomento de la Educación Superior – ICFES -, director de Planeación Antioquia y gobernador de Antioquia para el período 2016-2019."

                        "headline": "Rafael Aubad López",

                        "headline": "Jaime Restrepo Cuartas",
                        "text": "Jaime Restrepo nació en Medellín en 1944. Al finalizar la secundaria ingresó a la Universidad de Antioquia donde se graduó en Medicina y posteriormente cursó una especialización en cirugía general. Fue nombrado rector de la Universidad de Antioquia en 1995 y durante su periodo inicial se abren sedes de la Institución en Urabá, Caucasia, Puerto Berrio, Carmen de Viboral y Andes, donde se empiezan a consolidar los procesos de regionalización de la Universidad por todo el departamento. Durante su rectoría también fue creada la IPS Universitaria. Fue docente, vicedecano y decano de la Facultad de Medicina. Miembro de la Sociedad Latinoamericana de Trasplantes, Asociación Médica de Antioquia, Sociedad Colombiana de Hepatología y Cooperativa Médica de Antioquia, entre otras. Igualmente ejerció como director general de Colciencias y representante a la Cámara por Antioquia. También es autor de numerosas investigaciones y publicaciones. Cabe mencionar que fue elegido como rector para el periodo 1995-1997, pero fue confirmado en el cargo por el Consejo Superior Universitario hasta el año 2001."

                        "headline": "Alberto Uribe Correa",
                        "text": "Uribe Correa se educó en la Escuela Urbana de Varones Fernando González de Envigado y en el Colegio San José. Posteriormente se graduó como médico y cirujano en la Universidad de Antioquia con especialización en dermatología. Durante su periodo rectoral la Institución recibe la acreditación en alta calidad por el máximo periodo otorgado hasta esa fecha (9 años), y se inauguró la Sede de Investigación Universitaria –SIU–, una infraestructura pensada para albergar los grandes procesos de investigación y producción de nuevo conocimiento de la Universidad. El crecimiento de la Institución en términos de infraestructura es uno de los temas claves, pues durante este periodo sigue la apertura de nuevas sedes de la Universidad en las subregiones y Medellín. Además de dirigir la segunda universidad pública más importante del país, Uribe fue asesor de la Dirección Seccional de Salud de Antioquia y decano de la Facultad de Medicina. En 2015 dejó la rectoría y fue designado como asesor de la oficina rectoral de la Corporación Universitaria Americana. Es el rector con más tiempo de permanecia al frente de la institución, ocupando el cargo de rector durante cuatro periodos consecutivos. Fue también presidente de la Junta Directiva del Centro de Investigaciones Médicas y miembro del Parque Tecnológico de Antioquia."

                        "headline": "Mauricio Alviar Ramírez",

                        "headline": "John Jairo Arboleda Céspedes",
                        "text": "Médico veterinario y Magíster en Medicina Tropical de la Corporación de Ciencias Básicas Biomédicas de la Universidad de Antioquia. Arboleda también ha ejercido como docente y decano de la Facultad de Ciencias Agrarias, jefe del Centro de Investigaciones de la misma facultad, Vicerrector de Investigación encargado, rector encargado en varias oportunidades, director de Bienestar Universitario, director de Regionalización y Vicerrector general. Fue también presidente de la Asociación de Egresados de la Facultad de Ciencias Agrarias -Aseagrarias -. Arboleda se ha destacado como Investigador internacional en Plum Island Animal Disease Center (PIADC) del Departamento de Agricultura de EEUU, sede New York (1998-2000); conformó y lideró el grupo de investigación Centauro, primero en recibir la categoría A en la Escuela de Medicina Veterinaria de la Facultad de Ciencias Agrarias (2002); así como investigador asociado en el Grupo de Inmunovirología de la Facultad de Medicina de la Universidad de Antioquia (1996-2000). Entre sus principales logros durante su trayectoria por la Universidad de Antioquia se destacan: la transformación académico-administrativa de la Facultad de Medicina Veterinaria y Zootecnia en la Facultad de Ciencias Agrarias e impulsar la regionalización universitaria, instalando sedes en las nueve subregiones de Antioquia, con oferta de más de 50 programas académicos y más de 8000 graduados. Esta estrategia ha sido reconocida en 3 ocasiones por el Ministerio de Educación Nacional como el mejor programa de regionalización de la educación superior del país. Fue designado rector de la Universidad de Antioquia por el Consejo Superior Universitario el 27 de febrero de 2018 para el periodo 2018 – 2021."
