    <script>
        // Objeto JSON con la información de los rectores
        var timelineData = {
            "title": {

                "display_date": "1803 – 2018",
                
                "text": {
                    
                    "headline": "Rectores Universidad de Antioquia",
                    "text": "Línea de tiempo histórica de la rectoría de la UdeA."
                },
                "media": {

            "events": [
                {
                    "start_date": { "year": "1803" },
                    "end_date": { "year": "1812" },
                    "text": {
                        "headline": "Fray Rafael de la Serna",
                        "text": "Nació en Bogotá en 1768, fue el fundador del Colegio de los Franciscanos en Medellín en 1803. Ha sido reseñado como un buen escritor e investigador puesto que realizó estudios sobre algunos asuntos de orden religioso. En 1801 fray Rafael fue nombrado para ponerse al frente de lo que inicialmente fue una institución bajo preceptos franciscanos los cuales optaban por una unidad comunitaria y principalmente religiosa, pero que se transformaría bajo la idea de formar personas más dedicadas al campo intelectual. Dos años después de ser nombrado, llegó a Medellín para encargarse de la enseñanza mientras se construía el colegio y claustro en la plazuela José Félix de Restrepo (actual plazuela de San Ignacio). Fray Rafael se destacó también porque se encargó de abrir escuelas para el primer aprendizaje (primaria) en donde podían ingresar tanto ricos como pobres, teniendo en cuenta que los estatutos y la pedagogía estaban a cargo de éste. Uno de los asuntos relevantes en la posición del religioso frente al Colegio de la nueva fundación de los franciscanos, fue el plan de estudios que se le encargó hacer por primera vez para que la institución pudiera tener un derrotero en la forma de enseñanza. Las ideas que éste presentó se basaban principalmente en aplicar la filosofía como base de estudios franciscanos. además, pensó en no crear cátedras sino facultades en donde se cumpliría una “intensidad horaria semanal y la duración de cada curso” . Luego de haber presentado el plan de estudios fue rechazado por la asamblea revisora, como lo menciona Teresa Uribe, debido al interés de monopolizar la educación superior, esto último a manos de “entidades educativas establecidas en la capital: la Universidad de Santo Tomás, el Colegio de San Bartolomé, el Colegio de San Buenaventura y el Colegio del Rosario.” Al rechazar el plan de estudios propuestos por de la Serna, la institución se vio obligada a continuar con su enseñanza sobre gramática, filosofía y teología. Para 1812 en medio de los problemas políticos que se vivían por la independencia, de la Serna fue acusado de ayudar mediante sus ideas a contrarrestar la causa de las disputas políticas. Además, se le acusó de quemar el periódico La Bagatela publicado en Santa Fe por el señor Antonio Nariño. Por esta causa se le ordenó salir de la provincia, sin embargo el franciscano continuó en contacto con personas allegadas a él que habían seguido con su labor en el colegio. En 1818, luego de haber sido expulsado de la provincia de Antioquia, le ofrecieron nuevamente ponerse al frente de la enseñanza, pero fray Rafael se negó debido a que no había recursos para pagar a los franciscanos que enseñaban y en general para mantener y sostener el lugar."
                    },

                    "media": {
                        "url": "img/.jpg",
                        "caption": "Foto oficial del rector",
                        "credit": "Universidad de Antioquia" /* Opcional */
                    }
                },
                {
                    "start_date": { "year": "1812 " },
                    "end_date": { "year": "1813" },
                    "text": {
                        "headline": "Miguel Uribe Restrepo",
                        "text": "Nació en Envigado en 1792. Hijo de don Miguel María Uribe Vélez y doña Josefa de Restrepo (hermana de José Félix de Restrepo), fue uno de los 22 hijos de este matrimonio. Sus primeros estudios los realizó bajo supervisión del Pbro. Doctor Alberto María de la Calle. Ingresó al Colegio El Rosario en donde tuvo posiblemente como profesores a Caldas y Camilo Torres. Se dice que no alcanzó a doctorarse por inconvenientes políticos y sin embargo fue reconocido como doctor. Su participación en la institución comienza el 19 de enero de 1813, puesto que un año antes fue escogido para dictar la cátedra de filosofía; así el señor Uribe comienzó a ejercer en cargos políticos. En 1816 llega a ser parte del congreso de las provincias en el cual fue representante, pero esto le trajo disgustos políticos porque estuvo en peligro de ser fusilado por los actores de la reconquista española; pudo ser así, de no ser porque en el momento del suceso fingió estar loco. Gracias a su talento personal con la oralidad, tuvo la oportunidad de formar parte de algunos cargos como: director de una compañía de teatro que comenzó en el Colegio de Antioquia con algunas obras y en compañía del señor Mariano Ospina; figuró como primero en las listas de asuntos políticos, uno de estos últimos es la presidencia del Senado en la cual le correspondió escoger al Presidente de la República en 1837. Según lo propuesto por Julio Cesar García, refiriéndose a que los ideales y las luchas que tuvo en su cargo Uribe Restrepo, cimentaron el núcleo del partido conservador. Para la época en que estuvo a cargo de la Institución, se vislumbraron dos cambios importantes: los preceptos que impartían los franciscanos fueron desarrollándose para proyectarse más hacia una enseñanza laica mediante las ciencias exactas y naturales. Por otro lado, ls institución dejó de ser Colegio de la Nueva Fundación de los Franciscanos y pasó a ser Colegio de la Villa de Medellín. Finalmente, a Miguel Uribe Restrepo le ofrecieron el cargo de consejero de estado, el cual rechazó por problemas de salud y en vez de ello le sirvió de ayuda en Medellín al señor Miguel Uribe Ángel, hasta el 11 de mayo de 1842 cuando falleció."
                    },

                },

                {
                    "start_date": { "year": "1813" },
                    "end_date": { "year": "1815" },
                    "text": {
                        "headline": "Francisco José de Caldas",
                        "text": "La fecha de nacimiento del primer “científico criollo” como se conoce a Francisco José de Caldas, sigue siendo un tema de debate, pues hay quienes dicen que nació en 1768 y otros afirman que fue en 1769. Lo cierto es que este prócer nacido en Popayán fue hijo de don José de Caldas y doña Vicentina Tenorio. Caldas fue becado en el Colegio Mayor de Nuestra Señora del Rosario en Santafé, de donde se graduó en jurisprudencia (derecho) siguiendo las preferencias de sus padres, teniendo en cuenta que sus gustos se inclinaban más por la botánica, las matemáticas y la astronomía. Y aunque este científico mantuvo interés por la observación, también logró desarrollar sus ideas, logrando por ejemplo fabricar instrumentos que facilitaban la labor de investigación como el hipsómetro. Gracias al interés que siempre mostró en la materia, se dio una relación de respeto y admiración mutua entre José Celestino Mutis (fundador de la Real Expedición Botánica) y Caldas. Fue gracias a la brillantez, ingenio y buenos escritos –sobre las plantas que habían en Popayán y Quito– de Francisco José de Caldas que Mutis lo apodó “El Sabio”. Actualmente la Universidad de Antioquia cuenta con importante número de material académico de Caldas, donado por Carlos E. Restrepo. En 1813 acudió al llamado de Juan del Corral para que estableciera en Medellín una escuela militar, la cual fue inaugurada en 1814. Según lo referencia María Teresa Hincapié, el colegio–universidad entró en receso y operó allí la nueva academia de ingenieros militares. Esta fue la primera institución de ingenieros en Antioquia donde se impartieron conocimientos de aritmética, álgebra y trigonometría; además, 'el sabio' Caldas implementó la arquitectura instruyendo a los alumnos en tratados de artillería, arquitectura hidráulica, geografía militar y conocimientos generales (de construcción). Todo esto fue posible gracias a los amplios conocimientos de Caldas en matemáticas, astronomía y geografía. Una de las incidencias políticas que tuvo que ver con la creación de esta academia fue la independencia de la provincia de Antioquia puesto que al no ser dependiente, se hizo necesario un modelo de defensa robusto. En 1815 fue llamado para que estableciera una academia similar en Santa Fe, lo que conllevó a dar por terminada la institución en Medellín ya que Caldas debía retirarse. Para 1816, después de tener que refugiarse en otros lugares gracias a la reconquista española, fue encontrado y ejecutado junto con otros tres personajes (Francisco Antonio Ulloa, Miguel Buch y José Miguel Montalvo) compartiendo los cuatro una fosa común."
                    },

                    "text": {
                        "headline": "Liborio Mejía",
                        "text": "En el año de 1813 el Colegio de la Villa de Medellín seguía impartiendo su educación bajo los nuevos preceptos laicos diferentes de los religiosos que operaron con los franciscanos. Una de las variaciones fue que gracias a las ideas liberales influyentes de Europa se creó la Escuela de Gramática y Filosofía. En cuanto a su mantenimiento (esencialmente las cátedras de filosofía y latinidad) dependían del convento de franciscanos, impartiéndose las clases en una casa particular que se arrendaba al cabildo mientras se construía el edificio. Esta forma de mantenerse el colegio, continuó incluso con Liborio Mejía, nacido en Rionegro (Antioquia) el 28 de julio de 1792. Hijo de don José Antonio Mejía, quien fue regidor alcalde mayor de la provincia de Rionegro y de doña María Gutiérrez. Se interesó desde siempre por los estudios, ejerciéndolos en el Colegio Mayor de San Bartolomé en Bogotá, donde fue becado desde 1808 hasta terminar sus estudios en 1812. En Bogotá se ocupó junto a su familia en negocios comerciales dedicados al transporte de mercancías en lugares como Tunja, Antioquia y Santa Fe. En 1813 fue nombrado para ocupar el cargo de director del Colegio Provincial de Antioquia, impartiendo a su vez la cátedra de filosofía. Pero su estancia frente a la institución fue interrumpida en ese mismo año al ser nombrado por José María Ortíz, miembro del cabildo de la Villa, para que Mejía acompañara a Francisco José de Caldas a cumplir con trabajo militar; al tener que partir, cedió su cátedra a José Félix de Restrepo. En su carrera militar, Liborio Mejía se destacó como jefe de tropa debido a la buena formación pedagógica que tuvo en sus estudios. También sobresalió en su interés por continuar aprendiendo en su tiempo libre, lo que se vio reflejado en la traducción al castellano que realizó de algunos manuales militares franceses. Después de volver del sur con Caldas no pudo ejercer de nuevo sus labores pedagógicas, dado que debía marchar otra vez con el coronel José María Gutiérrez; no obstante alcanzó gran reconocimiento debido a sus logros. Fue nombrado Vicepresidente de la República el 22 de junio de 1816 contando con apenas 24 años. Un mes después de su nombramiento se dio la reconquista española y fue arrestado en combate. Fue fusilado en Santa Fe el 3 de septiembre del mismo año."
                    },

                    "media": {
                        "url": "img/rectores-xix/liborio-mejia.jpg",
                        "caption": "Foto oficial del rector Liborio Mejía"
                        
                    }
                },

                {
                    "start_date": { "year": "1813" },
                  
                    "text": {
                        "headline": "José Félix de Restrepo",
                        "text": "Existe una serie de disputas con respecto al lugar de nacimiento de José Félix de Restrepo, pues a pesar de que algunos documentos del archivo histórico nacional aluden a Medellín, hay quienes atribuyen a Envigado como posible lugar de origen. Lo cierto es que nació el 28 de noviembre de 1760 siendo hijo de Vicente Restrepo y Catalina Vélez de Rivero. Fue uno de los cuatro hijos de esta pareja, quienes les brindaron una buena educación (asunto complicado para la época por razones económicas), siendo dos de ellos sacerdotes, y los otros abogados, donde se incluye José Félix de Restrepo. Cursó sus primeros estudios en el Colegio de San Bartolomé, donde se dedicó de lleno al desarrollo de su educación. Alcanzó en 1780 a ser licenciado en leyes y graduado como doctor en derecho civil. Fue maestro de filosofía desde 1782 a 1812, y después de graduarse llegó a Medellín a dictar la cátedra a un seminario franciscano. Tuvo grandes experiencias como docente, destacándose por su capacidad a la hora de preparar a sus alumnos en oratoria logrando brillantes discursos públicos, y mediante sus buenas prácticas fue haciéndose acreedor de méritos reconocidos por sus alumnos. En 1813, recién llegado de Popayán fue elegido para reemplazar a Liborio Mejía, además para hacerse cargo de enseñar en la Escuela de Filosofía y Matemáticas. El nuevo papel que asumía Restrepo en la escuela tuvo énfasis en métodos modernos para la enseñanza de la física y las matemáticas. Restrepo no era partidario de las formas de educación religiosas y sus estudiantes parecían estar en un curso de matemáticas más que de filosofía. Uno de los aspectos en que más sobresalió el doctor Restrepo fue en su actitud antiesclavista; abogó por la libertad de esclavos, especialmente los partos de las mujeres esclavas, y en general la libertad de este grupo marginado. José Félix de Restrepo falleció en Bogotá el 23 de septiembre de 1832."
                    },

                    "media": {
                        "url": "img/rectores-xix/josefelix-derestrepo.jpg",
                        "caption": "Foto oficial del rector José Félix de Restrepo"
                        
                    }
                },

                {
                    "start_date": { "year": "1822" },
                    "end_date": { "year": "1824" },
                    "text": {
                        "headline": "José María Uribe Mondragón",
                        "text": "Hijo de don Ignacio Uribe Mejía y doña Ana Joaquina Vásquez Mondragón, José María Uribe nació en Medellín el 6 de abril de 1789. Realizó sus estudios junto a fray Rafael de la Serna, antiguo rector del Colegio Provincial de Antioquia. Al terminar sus estudios recibió el sacerdocio en la iglesia del monasterio de Santa Inés en Bogotá; buena parte de su trabajo como cura la realizó principalmente en Hatoviejo, en el municipio de Bello (Antioquia). Para 1822 empezó a funcionar el Colegio de Antioquia bajo la dirección de Uribe Mondragón, sin embargo se cree que entre 1815 y 1822 posiblemente siguió operando la academia de ingenieros militares instaurada por Francisco José de Caldas. Durante este período de la reconquista española se hizo lo posible por levantar las actividades en el lugar, especialmente las cátedras de filosofía y matemáticas, que fueron la visión principal desde que se creó el plantel. Antes de que se diera la apertura del Colegio de Antioquia hubo un suceso significativo para las bases de la educación de ese entonces. En 1821, el Congreso de Cúcuta decretó que los conventos con menos de ocho religiosos debían ser suprimidos; esto se dio mediante un decreto que cobijaba la conformación de escuelas de primeras letras en todas las villas (decreto del 28 de Julio de 1821). Un año después se dio a conocer el “proyecto educativo de Santander”, como lo denominó la maestra María Teresa Hincapié, en el que Francisco de Paula Santander dictó el decreto para dar ejecución a la creación de colegios en diferentes ciudades, conformándose a su vez el “decreto de creación del colegio de Antioquia”. De esta forma se resalta la función del coronel Francisco Urdaneta quien promovió la conclusión del edificio donde funcionó el colegio, con aportes que hicieron diferentes personas para esta labor, dándose apertura nuevamente al colegio el 23 de enero de 1823, siendo cabeza del plantel el señor José María Uribe Mondragón, quien también se encargó de dictar las clases de metafísica, latín, castellano y filosofía. Lo que destacó este periodo de la historia de la institución fue que el Colegio de Antioquia dejó de ser un colegio de la comunidad religiosa para pasar a ser parte del gobierno nacional, con la particularidad de que las rentas no corrieron a cargo de sus nuevos dueños, sino a manos de la comunidad, pues la supervisión de la institución estuvo a cargo del gobierno, mientras las rentas y el mantenimiento fueron asumidos por vecinos del lugar. Así como hubo cambios en diferentes aspectos (social, político y económico) también se pudo vislumbrar una continuidad entre esta nueva visión de la educación (decreto de 9 de octubre de 1822 por Santander) y el método que se venía dando desde los franciscanos: por un lado se mantiene la escuela de primeras letras, por otro lado se dan las mismas cátedras y por último –siendo ésta una de las más importantes– se continúa con la abolición pausada de la teología y por ende de los preceptos religiosos. Además de los anteriores cambios, es relevante mencionar que fue en este momento donde se comenzó con la idea (y con el terreno) que mantuvieron los franciscano para levantar el edificio de lo que es hoy la universidad. Ahora bien, para José María Uribe Mondragón fue un tanto complicada la situación económica en el colegio, por ende en 1824 renunció a su cargo. En 1833 el Pbro Uribe muere dejando como testamento sus obras literarias, entre las cuales se cuentan trabajos de literatura y de teología."
                    },

                    "media": {
                        "url": "img/rectores-xix/.jpg",
                        "caption": "Foto oficial del rector José María Uribe Mondragóna"
                        
                    }
                }, 

                {
                    "start_date": { "year": "1823" },
                    "end_date": { "year": "1825" },
                    "text": {
                        "headline": "Francisco Antonio Obregón",
                        "text": "Francisco Obregón nació en Barbosa (Antioquia) el 2 de abril de 1801 en el hogar de don Pedro Antonio de Obregón y Uribe y doña María Josefa Muñoz. En 1819 comenzó sus estudios en el Colegio Mayor de Nuestra Señora del Rosario y fue de allí donde se graduó como doctor en jurisprudencia. Luego de haber concluido su carrera volvió a su pueblo natal para ocuparse de la enseñanza de los jóvenes del lugar. Su participación en la Institución se dio desde que estuvo a cargo el Pbro. José María Uribe Mondragón, puesto que Obregón ejerció como vicerrector y catedrático en el Colegio de Antioquia. No obstante, en 1823 Enrique Umaña, intendente de Cundinamarca, lo designó para que se hiciera cargo de las materias de aritmética, álgebra, trigonometría y filosofía. Fue un año después que ocupó el cargo de rector de la Institución fomentando un cambio relevante en la instauración de las materias de química y mineralogía además de las cátedras que se venían impartiendo. Ahora bien, en los asuntos políticos y sociales que rodearon a Obregón, se destacó el hecho de haber sido desterrado del país, por no coincidir con el gobierno nacional y se internó en las Antillas, donde se dedicó a dictar clases de idiomas (inglés, francés y castellano). Para 1848 volvió al país y fue nombrado gobernador de Mompox, pero nuevamente se vio afectado por el destierro debido a la labor que ejerció como secretario en la administración que sucedió de la dictadura de José Hilario López; por ello se le tildó de colaborador y tuvo que huir a Venezuela y luego a La Habana. Falleció en Medellín el 29 de octubre de 1869."
                    },

                    "media": {
                        "url": "img/rectores-xix/francisco-a-obregon.jpg",
                        "caption": "Foto oficial del rector Francisco Antonio Obregón"
                        
                    }

        
                },

                {
                    "start_date": { "year": "1825" },
                    "end_date": { "year": "1826" },
                    "text": {
                        "headline": "Estanislao Gómez Barrientos",
                        "text": "Estanislao Gómez Barrientos nació en Medellín en 1798, siendo hijo de don José Joaquín Gómez Londoño y doña María Manuela Barrientos. Estudió jurisprudencia en el Colegio de San Bartolomé, y en 1815 se graduó como doctor en leyes de la Universidad Santo Tomás. Es importante mencionar que tuvo parentesco familiar con el antiguo rector, debido a que este último se casó con la hermana de Gómez Barrientos. Desempeñó varios cargos antes de desempeñarse como rector. Fue precisamente gracias a la responsabilidad y buen manejo que tuvo durante sus cargos políticos, que en 1825 se integró como rector de la Institución, pero un año después renunció al cargo y viajó a Bogotá para ejercer como abogado en asuntos de la república. Fue nombrado nuevamente rector en 1839 y a su vez se encargó de dictar la cátedra de jurisprudencia civil. Murió el 3 de julio de 1852 en Antioquia, siendo considerado un hombre ilustrado de su época."
                    },

                    "media": {
                        "url": "img/rectores-xix/estanislao-gomez.jpg",
                        "caption": "Foto oficial del rector Estanislao Gómez Barrientos"
                        
                    }
                },

                {
                    "start_date": { "year": "1826" },
                    "end_date": { "year": "1827" },
                    "text": {
                        "headline": "Timoteo Duarte",
                        "text": "Su participación en el Colegio de Antioquia se vislumbra por periodos, puesto que fue el encargado del plantel en ausencia del rector titular el Presbítero Estanislao Gómez, quien dejó la rectoría en 1826 para ocupar una curul como representante de Antioquia en la capital de la república. Duarte estuvo al frente de la Institución hasta abril de 1827, cuando llegó a hacerse cargo fray Juan Antonio Pino, pues la situación económica del Colegio presentaba graves problemas. Nuevamente sucedió a este último el 25 de julio de 1827 hasta 1828, año en el que asumió la rectoría José María Galavis. Luego de las diferentes sucesiones, el señor Duarte ejerció como profesor y rector interino en diferentes colegios y lugares. Después de haber salido del Colegio de Antioquia se encontraron algunas cuentas presentadas por el señor Emilio Robledo, en que se declaró un mal manejo económico de la Institución por parte de Timoteo Duarte. Este filósofo también fue rector interino del Colegio de Santa Librada de Cali, además de fungir como secretario y profesor universitario en Popayán. Duarte murió en Palmira (Valle) en 1868."
                    },

                    "media": {
                        "url": "img/rectores-xix/.jpg",
                        "caption": "Foto oficial del rector Timoteo Duarte"
                        
                    }
                },

                {
                    "start_date": { "year": "1827" },
                    "end_date": { "year": "1828" },
                    "text": {
                        "headline": "Fray Juan Antonio Pino",
                        "text": "Nació en Rionegro (Antioquia), se dice que bajo el cuidado de don José Joaquín Pino y doña Bárbara Montoya, ya que no se ha encontrado el documento que lo verifique, aunque se sabe que fue bautizado en 1794 y que realizó sus estudios en el Colegio Mayor de Nuestra Señora del Rosario. Al terminar sus estudios pasó a la formación religiosa en San Francisco. En su labor como religioso se dedicó a enseñar, no obstante en 1818 fue trasladado a Cali como corista y en 1820 acompañó al ejército como capellán. De allí en adelante se dedicó a instruir en gramática y artes en el mismo convento de San Francisco. En 1826 llegó a Antioquia para dictar las clases de matemáticas y lógica, actividades en las que se reconoció por tener gran conocimiento del campo. En cuanto a su rectorado, Julio Cesar García menciona su posesión en 1827 en el mes de abril y tres meses después se retiró del cargo para entregarse de lleno al movimiento religioso en la parroquia de San Martín de Cancán. Durante este periodo rectoral, el presidente Simón Bolívar firmó un decreto que le concedió al Colegio de Antioquia la enseñanza de la jurisprudencia en todos sus campos. Así como no se tiene certeza de la fecha de su nacimiento, tampoco se conoce la fecha de su deceso, puesto que el acta de defunción no se ha encontrado en Rionegro, donde falleció según los libros parroquiales correspondientes."
                    },
                    "media": {
                        "url": "img/rectores-xix/.jpg",
                        "caption": "Foto oficial del rector Fray Juan Antonio Pino"
                    }
                },

                {
                    "start_date": { "year": "1828" },
                    "end_date": { "year": "1829" },
                    "text": {
                        "headline": "José María Galavis",
                        "text": "Nació en Santa Fe de Bogotá en 1806 y fue educado por un oidor (antiguo juez), además de sus padres el señor Eustaquio Galavis y Hurtado y su esposa Teresa de Lasquetti. Sus estudios en grado de doctor los realizó en San Bartolomé, teniendo como profesor al ex rector del colegio el señor José Félix de Restrepo. Uno de los asuntos más relevantes que se puede vislumbrar en su rectorado fue la disputa que entabló con Simón Bolívar con el fin de suprimir el plan de estudios que implementó en 1822 el general Santander. Bolívar deseaba que se eliminaran principalmente las cátedras de jurisprudencia en todo el país y además se implementaran materias de ciencias naturales que eran más necesarias para el pueblo. El 25 de octubre de 1828, Bolívar logró la reforma (no sustitución). Después de la conspiración septembrina, en cumplimiento del decreto del 25 de octubre, el Colegio de Antioquia es cerrado y sus funciones se suspenden durante el resto de ese año. Sin embargo, para 1832 el presidente José María Obando restableció algunas de las cátedras que suprimió Bolívar durante su presidencia, anexando algunas materias jurisprudenciales. Es significativa la forma en que se le dio el reemplazo a Galavis, puesto que se menciona en una carta dirigida al intendente de Cundinamarca en nombre del presidente, su condición de joven para ocupar el puesto de rector del colegio."
                    },

                    "media": {
                        "url": "img/rectores-xix/jose-maria-galvis.jpg",
                        "caption": "Foto oficial del rector José María Galavis"
                        
                    }
                },

                {
                    "start_date": { "year": "1829" },
                    "end_date": { "year": "1830" },
                    "text": {
                        "headline": "Pbro. José María Botero",
                        "text": "Nació en 1789, hijo de don Félix Joaquín Botero y doña María Francisca Cadavid. Cursó sus estudios en el Colegio de Nuestra Señora del Rosario, tras lo cual fue ordenado sacerdote en 1818 por el obispo de Popayán. Durante su vida eclesiástica se dedicó a la enseñanza, pues desde siempre estuvo ligado a esta labor siendo reconocido por sus alumnos como un buen maestro. Sus prácticas académicas le permitieron llegar a la capellanía de San Lorenzo –en Medellín– a seguir dictando clases, incluso materias que ya venía impartiendo en el Colegio de Nuestra Señora del Rosario como el derecho canónico y lengua latina, entre otras. Además de las actividades que ejercía como profesor también fue rector del mismo colegio y enseñó en otros lugares. Toda su vida estuvo marcada por la enseñanza, y justamente esto lo condujo a actuar en contra de los preceptos que el gobierno tenía para la educación, lo que le significó no ser partícipe de las “tendencia utilitaristas de la educación”, como lo afirma la historiadora María Teresa Uribe. En vista de esta diferencia de ideales, el presbítero fomentó conflictos dentro de las aulas de clases. Fue llevado a juicio en 1835 debido a sus conductas conflictivas y se le dio orden de captura, no obstante se le formuló un segundo juicio público, en el que fue condenado a muerte. Algunas personas abogaron por él alegando que sufría de locura y de esta forma se le realizaron estudios que efectivamente encontraron algo de cierto en el diagnóstico. A esta manifestación por parte de las personas que recurrieron en su auxilio se le llamó “la revolución del padre Botero”. Cabe destacar que para esta época el interés por parte del gobierno para crear una educación basada en principios de renovación industrial, significaba dejar un poco de lado los preceptos religiosos, y fue esto justamente lo que movió a la revolución que ejerció el sacerdote."
                    },

                    "media": {
                        "url": "img/rectores-xix/.jpg",
                        "caption": "Foto oficial del rector Pbro. José María Botero"
                        
                    }
                },

                {
                    "start_date": { "year": "1830" },
                    "end_date": { "year": "1833" },
                    "text": {
                
                        "text": "Desde 1830 el Colegio de Antioquia pasó por una difícil situación que lo llevó a ser cerrado durante cuatro años. Luego de que el presidente José María Obando y el Congreso autorizaron nuevamente al Colegio de Antioquia para dictar las cátedras de jurisprudencia y de que padres de familia y miembros de la sociedad antioqueña pidieron que se abrieran las puertas del Colegio, finalmente la petición fue tenida en cuenta por el Congreso de la República. El gobierno dictó un decreto que reorganizó la Institución y le otorgó el nombre de Colegio Académico de Antioquia; además, dispuso que se mantuvieran las cátedras de gramática y filosofía, y que se crearan las de historia e instituciones canónicas, disciplina e historia eclesiástica, suma de concilios, química y mineralogía."
                    }
                },



                {
                    "start_date": { "year": "1833" },
                    "end_date": { "year": "1836" },
                    "text": {
                        "headline": "Manuel Tiberio Gómez Restrepo",
                        "text": "Nació en Rionegro en 1810. Sus estudios los realizó en el Colegio de Antioquia y en la Universidad Santo Tomás en Bogotá, y tras graduarse complementó con otros aspectos académicos como los idiomas (inglés, francés y latino) además de lo jurídico. Antes de que iniciara la rectoría de Gómez Restrepo, la Institución estuvo cerrada debido a las secuelas que dejó la dictadura del general Urdaneta, lo que afectó el funcionamiento económico del colegio debido al retiro de las rentas que llegaban a éste por parte del gobierno . Por lo tanto en 1831, el gobernador Francisco Montoya Zapata, junto con las personas interesadas en la educación, notaron la necesidad de continuar con la enseñanza que se venía impartiendo en el plantel y abrir nuevas escuelas gratuitas, razón por la cual el gobernador decidió recolectar fondos con el aporte de algunos lugareños. Fue así como en 1833 se dictó el decreto que autorizaba reabrir la Institución que pasó a llamarse Colegio Académico de Antioquia, siendo designado como rector el señor Manuel Tiberio Gómez Restrepo. Goméz Restrepo también se desempeñó como secretario de la Cámara Provincial y fungió como fiscal acusador en el juicio que se entabló en contra del anterior rector José María Botero."
                    },

                    "media": {
                        "url": "img/rectores-xix/.jpg",
                        "caption": "Foto oficial del rector Manuel Tiberio Gómez Restrepo"
                        
                    }
                },

                {
                    "start_date": { "year": "1836" },
                    
                    "text": {
                        "headline": "José María Vélez Mateus",
                        "text": "José María Vélez Mateus realizó sus estudios en Bogotá, donde se graduó con el título de doctor en jurisprudencia. Antes de ser rector del Colegio Académico de Antioquia, ya había tenido experiencia en cargos públicos como fiscal provisional, lo que le permitió tener mayor aceptación y participación en la sociedad . En 1836 se hizo cargo de la rectoría del colegio, pero a su vez se desataron algunos problemas económicos en la institución, uno de ellos fue la dificultad de la contratación a los docentes (precisamente por la “escases de dinero”) quienes al final solo fueron contratados mediante la disponibilidad monetaria de algunos ciudadanos . No obstante en el periodo rectoral de Vélez Mateus, no solo ocurrieron rencillas económicas, sino que se habla de una agitación cultural y política. Esta última se debió principalmente al disgusto de los padres de familia, quienes estaban preocupados por las enseñanzas a las que volvía el colegio según las directrices educativas del país (pues con Santander se puso en práctica las cátedras de Bentham). Muchos de los académicos del momento al ser educados con algunos preceptos Benthamitas no les disgustaba del todo la idea de restablecer la cátedra, pero los padres de familia optaban por una enseñanza más dedicada a la moral y la religión."
                    },

                    "media": {
                        "url": "img/rectores-xix/.jpg",
                        "caption": "Foto oficial del rector José María Vélez Mateus"
                        
                    }
                },

                {
                    "start_date": { "year": "1836" },
                    "end_date": { "year": "1838" },
                    "text": {
                        "headline": "Mariano Ospina Rodríguez",
                        "text": "Mariano Ospina nació en Cundinamarca en 1805. Cursó sus estudios de jurisprudencia en el Colegio de San Bartolomé, donde demostró desde siempre su interés por la labor educativa, razón que explica su constante preocupación por la enseñanza. Llegó a Antioquia buscando refugio, ya que era perseguido por sus arraigadas creencias democráticas, y fue en este lugar donde es considerado, según Luis López de Mesa, como “uno de los seis colombianos que en el siglo XIX ejercieron influencia más decisiva en los destinos de Antioquia”. La época en la que Mariano Ospina se desempeñó como rector del colegio (y en su recorrido personal), representó un avance a nivel educativo debido a los planteamientos que propuso. En 1826, antes de llegar a la rectoría del Colegio Académico de Antioquia, comenzó a levantar una institución que tuvo como base una enseñanza más práctica que teórica. Precisamente fue esta visión pragmática del señor Ospina lo que permitió que se hiciera cargo de ciertos asuntos relacionados con el cumplimiento de este pensamiento. Una de sus prioridades educativas fue fomentar la creación de escuelas normales en todas las capitales, puesto que tendrían un plan de estudios con dirección pragmática. Entre ello cabe destacar la formalización de la enseñanza militar como parte del plan de estudios (por la necesidad de tener ejército de reserva), debido a bloqueos en la costa por parte de Francia e Inglaterra. Otra de las particularidades de Ospina fueron las enseñanzas que transmitió a sus discípulos en cuanto a la libertad de objetar las lecturas que hacían, no obstante es válido mencionar que su trayectoria intelectual se enriqueció con las investigaciones en la religión cristiana y la filosofía racionalista. Además de ser rector de la Institución, fue un personaje político destacado en el país al ocupar varios cargos públicos como docente en diversos colegios, gobernador de Antioquia (1845) y presidente de Colombia (1857-1861). Por otro lado, uno de los hechos más destacados en la vida política de Mariano Ospina fue su participación en la Guerra de los Supremos –un conflicto interno del país, en el cual los pleitos religiosos terminaron en problemas políticos que permitieron el enfrentamiento entre dos líderes: José María Obando y José Ignacio de Márquez, candidatos a la presidencia, formando parte de uno de los dos bandos. Luego de ser condenado a prisión en Cartagena, Ospina Rodríguez huyó a Guatemala donde permaneció hasta 1871 cuando regresó a Medellín, lugar donde 14 años después falleció un 11 de enero de 1885."
                    },

                    "media": {
                        "url": "img/rectores-xix/mariano-ospina-rodriguez.jpg",
                        "caption": "Foto oficial del rector Mariano Ospina Rodríguez"
                        
                    }
                },

                {
                    "start_date": { "year": "1838" },
                    
                    "text": {
                        "headline": "Joaquín Emilio Gómez",
                        "text": "Joaquín Emilio Gómez nació en 1807 en Medellín, donde también cursó sus estudios en el Colegio de Antioquia bajo la rectoría del Pbro. Uribe Mondragón; además realizó estudios de jurisprudencia en el Colegio de San Bartolomé, del que se graduó en 1831. Gómez formó parte del Colegio Académico de Antioquia como rector interino, en reemplazo de Mariano Ospina Rodríguez, quien se ausentó en 1838 del cargo. Tras complementar sus estudios y debido al buen desempeño que obtuvo, se le ofreció ser el representante al Consejo de la República, trabajando allí con personajes que apoyaban la candidatura del señor José Ignacio de Márquez en la mencionada Guerra de los Supremos. Su participación directa en la Institución comenzó desde su época de estudiante en este mismo plantel, pasando por la labor de profesor de varias materias como la cátedra de derecho civil y derecho internacional, entre otras. Fue también vicerrector durante estos mismos años. En 1838, Joaquín Emilio Gómez renunció al rectorado y se dedicó a otros cargos públicos."
                    },

                    "media": {
                        "url": "img/rectores-xix/joaquin-emilio-gomez.jpg",
                        "caption": "Foto oficial del rector Joaquín Emilio Gómez"
                        
                    }
                },


                {
                    "start_date": { "year": "1838" },
                    "end_date": { "year": "1839" },
                    "text": {
                        "headline": "Juan Nepomuceno Pontón",
                        "text": "Juan Nepomuceno Pontón nació en Medellín en 1816. Realizó algunos de sus estudios en Bogotá ejerciendo después bajo el título de abogado. Posteriormente, en 1837 trabajó como profesor en Medellín en el Colegio Académico de Antioquia, y un año después fue nombrado rector interino del mismo plantel, tras la renuncia del antiguo encargado el señor Joaquín Emilio Gómez. La formación que predicaba Juan Nepomuceno era principalmente basada en el utilitarismo. También fungió como gobernador de la provincia en 1840, siendo su secretario el señor José María Facio Lince, quien posteriormente sería rector de la Institución. En 1839, un año después de iniciar su periodo rectoral, Pontón renunció a este cargo aduciendo motivos personales."
                    },

                    "media": {
                        "url": "img/rectores-xix/.jpg",
                        "caption": "Foto oficial del rector Juan Nepomuceno Pontón"
                        
                    }
                },

                {
                    "start_date": { "year": "1839" },
                    "end_date": { "year": "1840" },
                    "text": {
                        "headline": "Estanislao Gómez Barrientos",
                        "text": "Gómez Barrientos volvió a hacerse cargo de la rectoría en 1839, dado que ya había ocupado el mismo en el periodo de 1825-1826. Se encargó de dictar la cátedra de jurisprudencia civil, además de trabajar en conjunto con el vicerrector Antonio María Jiménez, quien ingresó a la rectoría en 1840. Estanislao Gómez Barrientos nació en Medellín en 1798, siendo hijo de don José Joaquín Gómez Londoño y doña María Manuela Barrientos. Estudió jurisprudencia en el Colegio de San Bartolomé y en 1815 se graduó como doctor en leyes de la Universidad Santo Tomás. Gómez Barrientos desempeñó varios cargos antes de fungir como rector. Fue precisamente gracias a la responsabilidad y buen manejo que tuvo durante sus cargos políticos, que en 1825 se integró como rector de la Institución, pero un año después renunció al cargo y viajó a Bogotá para ejercer como abogado en asuntos de la República. Falleció el 3 de julio de 1852 en Antioquia, siendo considerado un hombre ilustrado de su época."
                    },

                    "media": {
                        "url": "img/rectores-xix/estanislao-gomez.jpg",
                        "caption": "Foto oficial del rector Estanislao Gómez Barrientos"
                        
                    }
                },

                {
                    "start_date": { "year": "1840" },
                    "end_date": { "year": "1843" },
                    "text": {
                        "headline": "Antonio María Jiménez",
                        "text": "La participación de Antonio María Jiménez en el Colegio Académico de Antioquia se dio inicialmente en 1839 en calidad de profesor, aunque ya había sido alumno de algunos profesores de la institución. Durante su periodo rectoral la Cámara Provincial dispone que la capilla del Colegio pase a manos del obispo, pues la institución educativa no contaba con los recursos necesarios para repararla. Jiménez también ocupó en diferentes momentos de la historia de la Institución algunos cargos relevantes como vicerrector así como rector encargado durante la ausencia de Estanislao Gómez. Además, para 1851 laboró como secretario del entonces rector Emeterio Ospino, encargándose nuevamente del rectorado a finales de ese mismo año hasta su muerte un año después. "
                    },

                    "media": {
                        "url": "img/rectores-xix/.jpg",
                        "caption": "Foto oficial del rector Antonio María Jiménez"
                        
                    }
                },

                {
                    "start_date": { "year": "1844" },
                    "end_date": { "year": "1846" },
                    "text": {
                        "headline": "Los Jesuitas: José Segundo Laínez, Joaquín Freyre y Luis Amorós",
                        "text": "El momento en que llegan los jesuitas al Colegio Académico de Antioquia es el periodo posterior a la Guerra de los Supremos, por ende, fue este instante en que se vislumbró el disgusto por parte de docentes, alumnos y los mismos vecinos del lugar por la clase de formación que recibían en el claustro, es decir, con la guerra se llegó a pensar que era necesaria la presencia religiosa para propiciar un manejo adecuado a la Institución. El arribo de estos religiosos se produjo esencialmente gracias al mandato del gobernador Juan María Gómez, acompañado de algunos personajes ilustres del momento como Rafael Mosquera, quien era promotor de que la presencia jesuita era de vital importancia para quienes seguían el plan de estudios de Santander. De esta forma llegaron los primeros jesuitas encargados: Joaquín Freire, Luis Amorós y José Segundo Laínez, quienes tuvieron una buena acogida por parte de los habitantes de la provincia. Se ocuparon no solamente del Colegio Académico, sino que también realizaban las misiones en otros lugares de la provincia. Una de las actividades adicionales que ejecutaron fueron los sermones que se ofrecieron en la iglesia (antes administrada por los franciscanos y que pasó a manos jesuitas) a los cuales concurrían muchos fieles participando activamente de los asuntos espirituales. Sin embargo, y a pesar de la buena forma en que los religiosos se hacían cargo de la comunidad, no desaparecían los antiguos estudiantes que optaban por la reforma Santanderista. Algunos de estos personajes pertenecían a la llamada comunidad de “amigos del país”, descrito por María Teresa Uribe como una asociación política, cultural y literaria de orientación liberal, los cuales tenían una visión más pragmática en cuanto al modelo de enseñanza. Estos “amigos del país” al mando de José María Faciolince (quien posteriormente fue rector del colegio), se encargaron de lanzar propuestas en contra de la compañía, defendiendo el hecho de que era necesaria una educación basada en preceptos críticos y de libre pensamiento. En el momento de la pugna entre religiosos y políticos, Mariano Ospina gobernador de la provincia abogó por la presencia jesuita en el Colegio, pero la Asamblea Providencial se opuso a esto debido a que la participación de los “amigos del país” tenía una alta influencia en el medio. Así fue como la compañía de Jesús se vio obligada a dejar el Colegio Académico nuevamente en manos de la provincia."
                    },

                    "media": {
                        "url": "img/rectores-xix/.jpg",
                        "caption": "Foto oficial del rector Los Jesuitas: José Segundo Laínez, Joaquín Freyre y Luis Amorós"
                        
                    }
                },

                {
                    "start_date": { "year": "1846" },
                    "end_date": { "year": "1850" },
                    "text": {
                        "headline": "Jose María Facio Lince",
                        "text": "Nació en Medellín en 1816. Realizó sus estudios en el Colegio Académico y posteriormente se graduó como Doctor en Jurisprudencia en el Colegio de San Bartolomé. Ejerció primero como profesor de matemáticas y más tarde recibió la rectoría de los jesuitas siendo el líder de los llamados 'amigos del país' o 'afilosofados', grupo antijesuita que representó un cambio en la enseñanza impartida en la institución. Esta acción le valió la expulsión en 1848, siendo reemplazado por Cosme Zuleta, lo que causó descontento general en el Colegio, y por consiguiente fue llamado nuevamente a ocupar el cargo hasta 1851. En su rectorado introdujo materias como economía política, derecho de gentes y física mecánica. De esta forma, fue esa la etapa en que gracias a la participación laica en la Institución se conformó el “radicalismo antioqueño”, ejerciendo una participación política activa y permitiendo la libre enseñanza en el campo académico. Sin embargo, el Colegio fue nuevamente blanco de la guerra civil que se dio durante 1851 y 1854, siendo precisamente el claustro el que albergó a los actores de esta guerra generada por conservadores en contra del gobierno de José Hilario López. Facio Lince es recordado como uno de los abogados y oradores más importantes de Antioquia. Murió en 1853."
                    },

                    "media": {
                        "url": "img/rectores-xix/jose-maria-faciolince.jpg",
                        "caption": "Foto oficial del rector Jose María Facio Lince"
                        
                    }
                },

                {
                    "start_date": { "year": "1850" },
                    "end_date": { "year": "1851" },
                    "text": {
                        "headline": "Pbro. Emeterio Ospino",
                        "text": "Nació en Mompox en 1807. Durante su periodo rectoral no se destacan grandes eventos debido a su corto tiempo al frente del Colegio Académico de Antioquia. Se destacó por el hecho de su oposición constante a la participación de los jesuitas en el lugar. Por otro lado se sabe que dictó algunas clases en el Colegio, pero para esta época se dan revueltas que lo dejan en muy mal estado, pues los acontecimientos políticos interrumpieron nuevamente la cotidianidad del lugar. En esta ocasión, el rector obedeció la orden de ceder el edificio para el alojamiento de las tropas dirigidas por Eusebio Borrero. La biblioteca fue saqueada."
                    },

                    "media": {
                        "url": "img/rectores-xix/.jpg",
                        "caption": "Foto oficial del rector Pbro. Emeterio Ospino"
                        
                    }
                },

                {
                    "start_date": { "year": "1851" },
                    "end_date": { "year": "1852" },
                    "text": {
                        "headline": "Antonio María Jiménez",
                        "text": "Fue muy poco el tiempo en que estuvo a cargo de la institución el señor Antonio María Jiménez. El autor Julio Cesar García menciona la revolución de 1851 en la que (como se había mencionado antes) el colegio es tomado como albergue militar (1 de Julio de 1851). Durante su administración se arrienda una casa situada en la Plazuela San Roque para continuar las actividades académicas, pues en las instalaciones permanecían las tropas de Eusebio Borrero. Sin embargo, al retomar las labores fue corto el tiempo en que Jiménez se hizo cargo de la rectoría, dado que murió poco después en 1852. El 1 de abril de 1852, el día de la Virgen de los Dolores fue señalado por el rector para la reapertura de la Institución. Esta vez recibió el nombre de Colegio Provincial."
                    },

                    "media": {
                        "url": "img/rectores-xix/.jpg",
                        "caption": "Foto oficial del rector Antonio María Jiménez"
                        
                    }
                },

                {
                    "start_date": { "year": "1852" },
                    
                    "text": {
                     
                        "text": "En 1850 durante el gobierno de José Hilario López se expidió una ley que cambió la forma de enseñanza, pues se permitió la instrucción académica en cualquier recinto (tanto público como privado). Además, quienes se encargaban de impartirla no necesariamente tenía que demostrar un título académico, esto significó poder obtener un título universitario sin importar la condición. Este cambio abrupto se dio al mismo tiempo que las guerras civiles (lo que generó la política educativa como consecuencia) en contra de José Hilario López, debido a esto se cerró el Colegio Académico para utilizarlo como cuartel. Luego de la inactividad del colegio, surgió nuevamente la labor académica en el recinto, pasando a ser el Colegio Provincial de Medellín. Sin embargo, la apertura del colegio se dio según los preceptos de la nueva forma de enseñanza erigida por José Hilario López."
                    },

                },

                {
                    "start_date": { "year": "1852" },
                    
                    "text": {
                        "headline": "Nicolás Florencio Villa",
                        "text": "Este abogado nació en 1812 en San Pedro, Antioquia. Estudió en el Colegio Académico y al finalizar llegó a Bogotá para poner en práctica los saberes obtenidos en jurisprudencia. Nicolás Florencio Villa fue periodista y redactor del periódico El amigo del país. Un hecho relevante durante su labor como rector del Colegio Provincial fue la ordenanza que se le encargó de la formación de una escuela de artes que funcionara anexa al colegio. También fue amplia la participación política ejercida por Florencio Villa. Entre ellas se cuenta: ejerció en varias cámaras provinciales, en sesiones del Congreso, fue abogado de los tribunales de la república, profesor del Colegio de Santa Teresa, ocupó el cargo de personero comunal y fue procurador del estado. Durante su periodo rectoral, Villa solicitó una licencia de seis meses para asistir al Congreso. Debido a esto fue necesaria la presencia de un reemplazo, siendo nombrado el señor José Ignacio Escobar."
                    },

                    "media": {
                        "url": "img/rectores-xix/nicolas-florencio-villa.jpg",
                        "caption": "Foto oficial del rector Nicolás Florencio Villa"
                        
                    }
                },

                {
                    "start_date": { "year": "1853" },
                    
                    "text": {
                        "headline": "José Cosme Zuleta",
                        "text": "Este obispo ya había hecho parte del rectorado del Colegio (como rector interino) cuando estuvo a cargo el señor Facio Lince. No obstante su labor en la Institución siempre estuvo enmarcada en la docencia, desempeñándose además como cura – rector en el seminario . Cosme Zuleta también se desempeñó como rector del Colegio San José (actualmente La Presentación), durante 1851; también estuvo al mando de la catedral de Medellín en 1876."
                    },

                    "media": {
                        "url": "img/rectores-xix/jose-cosme-zuleta.jpg",
                        "caption": "Foto oficial del rector José Cosme Zuleta"
                        
                    }
                },

                {
                    "start_date": { "year": "1854" },
                  
                    "text": {
                        "headline": "Jorge Juan Hoyos",
                        "text": "Jorge Juan Hoyos, originario de Buga, nació en 1812. Realizó sus estudios en Popayán donde recibió su grado de jurisconsulto en 1835. Después de recibir su título ejerció una amplia participación en el campo político. Algunos de sus cargos fueron: secretario de hacienda - una labor complicada debido a que durante este periodo el país atravesó por un momento de guerra (de los supremos) provocando una insuficiencia en la economía -, y miembro de la cámara de representantes. Para 1853, Hoyos tuvo que refugiarse en Antioquia donde continuó con su participación activa en cargos públicos como la gobernación. También llegó a la universidad al ser rechazado el puesto por el presbítero José Joaquín Isaza, quien posteriormente sería obispo de Medellín. Así, en 1854, tomó lugar como rector del Colegio. Por este entonces la Institución atravesaba por un momento de poca credibilidad entre el público, tanto así que el autor Julio César García menciona la presencia de solamente ocho estudiantes en el plantel (al principio del año); una de las causas puede ser 'el hecho de que se incrementó la participación en otros colegios como el de Mariano Ospina y el de la unión que dirigió José Cosme Zuleta' A finales de ese año, Hoyos llegó a su tierra natal para continuar trabajando en algunos de los puestos que ya había ejercido. Ya en 1861, desempeñó el cargo de administración de la aduana de Buenaventura, donde el 26 de marzo murió quemado a manos de los 'revolucionarios al mando del coronel Manuel Esteban Pedroza'."
                    },

                    "media": {
                        "url": "img/rectores-xix/jorge-juan-hoyos.jpg",
                        "caption": "Foto oficial del rector Jorge Juan Hoyos"
                        
                    }
                },

                {
                    "start_date": { "year": "1855" },
                    
                    "text": {
                        "headline": "Pedro Antonio Restrepo Escobar",
                        "text": "Fue estudiante en el Colegio de Nuestra Señora del Rosario en Bogotá, en donde se graduó como abogado. No solamente se dedicó a ejercer el derecho, sino que también hizo parte de la Sociedad de los Amigos del país, en donde a su vez surgió una oposición en contra de la Compañía de Jesús. Para ello sería necesario adentrarse en un estudio sobre el asunto, debido a que resulta contradictorio la forma en que posteriormente cambió de idea hacia los ignacianos, dado que la misma Sociedad de Amigos no compartía buenas relaciones con la forma de enseñanza de esta orden. Restrepo Escobar ocupó varios cargos en Antioquia, algunos de ellos en lo administrativo, como representante al congreso y diputado a la legislatura de Antioquia. Como profesor enseñó en varios planteles como el Colegio de La Unión, de las señoritas María Josefa y Rosalía Restrepo, así como en escuelas normales de varones y de señoritas, entre otras. Mientras tanto en el Colegio Provincial (y en general en las instituciones de enseñanza secundaria y universitaria) se presentaba un artículo en el cual para poder obtener la licencia de graduado se debía cumplir con ciertos requisitos tales como el tiempo de los exámenes, las materias que se debían tomar, y la buena conducta, entre otros."
                    },

                    "media": {
                        "url": "img/rectores-xix/pedro-antonio-restrepo.jpg",
                        "caption": "Foto oficial del rector Pedro Antonio Restrepo Escobar"
                        
                    }
                },

                {
                    "start_date": { "year": "1855" },
                   
                    "text": {
                        "headline": "Luis María Restrepo",
                        "text": "Nació en en 1832 en Amagá (Antioquia), donde también cursó sus primeros estudios. Luego continuó en el Colegio Provincial de Medellín y finalmente los terminó en el Colegio Mayor de Nuestra Señora del Rosario en Bogotá. Recibió el grado en jurisprudencia, profesión que ejerció como juez principal del circuito de Medellín. Fue también gobernador del estado de Antioquia, secretario de hacienda, ocupó una curul en el senado de la República, e hizo parte del régimen militar. En 1855, Restrepo fue escogido para ocupar el cargo de vicerrector del Colegio, pero en este mismo año se le nombró rector interino para reemplazar al señor Antonio Restrepo Escobar, a quien le fue otorgada una licencia, así como en algunas otras ocasiones en que este último se encontraba de viaje. Posteriormente continuó dictando algunas materias (derecho criminal y hermenéutica, entre otras) en la Institución, incluso en 1872 cuando ya tenía por nombre Universidad de Antioquia."
                    },

                    "media": {
                        "url": "img/rectores-xix/luis-maria-restrepo.jpg",
                        "caption": "Foto oficial del rector Luis María Restrepo"
                        
                    }
                },

                {
                    "start_date": { "year": "1856" },
                   
                    "text": {
                      
                        "text": "Para la fecha en que se conoce como Colegio del estado de Antioquia (1856) se aplicó el proyecto educativo de Pedro Justo Berrio, reglamentando la enseñanza secundaria y profesional por ley. A esta forma educativa se interpusieron las guerras civiles que se dieron entre 1860 y 1864. Pedro Justo Berrio se hizo cargo del poder ejecutivo regional, y con ello aplicó algunos aspectos importantes en la labor educativa tales como: “el compromiso de los padres de familia en la educación de los menores y el papel de la urbanidad, la moral católica, las ciencias físicas y naturales, y las disciplinas artesanales en la formación de ciudadanos”. Además, se pensó en impartir la educación mediante la clasificación de los educandos, es decir, “para los pobres una enseñanza práctica de las artes y ciencias que se consideraban más útiles, así como la inconveniencia de los estudios filosóficos y literarios en la formación de la juventud”, dejando un poco de lado la clasificación social, y enfocándose un poco más en los nuevos aspectos que se le imprimen a la educación. Es necesario mencionar la importancia de la formación de nivel superior para que se diera un desarrollo pleno a la secundaria, evidenciándose en estos últimos la formación pedagógica de los primeros. A pesar del modelo que pretendía seguir Pedro Justo Berrio –modelo de corte francés (enciclopédico) más que el alemán (investigativo) – se logró combinar en la educación los diferentes saberes, tanto de aplicación inmediata como con la caligrafía, religión, y la gramática castellana, entre otras. A propósito del mando que ejerció el señor Berrío, éste a su vez proporcionó el cambio en el ámbito académico con respecto del estado, es decir, una de las razones del cambio de Colegio Provincial de Medellín a Colegio del estado de Antioquia, fue el desarrollo de nuevas materias, como la Escuela de literatura: idiomas patrio, latino, inglés y francés; la Escuela de matemáticas: aritmética, algebra y trigonometría rectilíneas, geometría práctica, geometría elemental y geografía; la Escuela de ciencias intelectuales: teodicea, ética, lógica y psicología, entre otras” que permitieron el desarrollo del estado. Se forja este ideal después de la creación del Estado Federal de Antioquia en 1856, periodo durante el cual el nuevo estado luchó por la autonomía de algunos aspectos con respecto al gobierno nacional. De esta forma, durante su rectorado, el señor Pedro Antonio Restrepo Escobar, junto con Berrío, abogaron por el libre desarrollo en el campo académico."
                    },

                    
                },

                {
                    "start_date": { "year": "1859" },
                    "end_date": { "year": "1861" },
                    "text": {
                        "headline": "Pbro. Mariano Antonio Sánchez",
                        "text": "Este sacerdote nació el 26 de julio de 1812. Realizó sus estudios en el Colegio de Medellín, siguiéndole a ello su interés por la educación que recibió en el Seminario de Antioquia, en donde obtuvo las órdenes sacerdotales. Posteriormente se dirigió a dos comunidades en especial para aplicar sus conocimientos sobre misiones religiosas, lo que incluía “la salvación de las almas”. Su paso por la rectoría de la Institución fue en el año de 1859 en reemplazo del señor Pedro Antonio Restrepo Escobar. Además de estar al frente del Colegio, se encargó de dictar las cátedras de latín y religión. Durante este periodo se desató una nueva guerra civil que perjudicó las actividades académicas del Colegio y las instalaciones tuvieron que ser desocupadas para alojar las fuerzas al servicio de la Confederación. El gobierno departamental se esforzó por mantener las clases en medio de la guerra civil y dictó un decreto de reorganización de la institución. Sin embargo, el cierre del Colegio fue inevitable y las clases se suspendieron en julio de 1861. Alude el autor Julio César García a este personaje el poder que tenía en la defensa de los derechos de “las masas populares” así como del clero. Debido a esto, Sánchez debió afrontar una persecución en su contra que lo obligó a refugiarse en otros lugares, contrayendo una enfermedad que lo llevó a la muerte en 1864."
                    },

                    "media": {
                        "url": "img/rectores-xix/.jpg",
                        "caption": "Foto oficial del rector Pbro. Mariano Antonio Sánchez"
                        
                    }
                },

                {
                    "start_date": { "year": "1863" },
                   
                    "text": {
                        "headline": "Benito Alejandro Balcázar",
                        "text": "Debido a los problemas políticos que se dieron durante 1860, el Colegio del Estado de Antioquia fue cerrado, siendo atendido en ocasiones por el vicerrector Benito Balcázar. Pero en 1863, la gobernación propuso al señor José María Martínez encargarse de la rectoría, quien no aceptó el cargo, siendo nombrado Balcázar como rector interino. Ejerció como profesor en la Institución, además de la Normal Antioqueña. El autor Julio César García en su biografía de los rectores de la Universidad de Antioquia, menciona el retiro de Balcázar por hostilidades con el gobierno de turno. Además, en 1863, se hizo cargo de la gobernación por unos días mientras llegaba a ocuparse Pascual Bravo."
                    },

                    "media": {
                        "url": "img/rectores-xix/.jpg",
                        "caption": "Foto oficial del rector Benito Alejandro Balcázar"
                        
                    }
                },

                {
                    "start_date": { "year": "1864" },
                   
                    "text": {
                        "headline": "Román de Hoyos",
                        "text": "Nació el 31 de marzo de 1816 sin que se sepa con exactitud su lugar de nacimiento, debido a que existen documentos que certifican su bautizo en el Colegio Mayor de Nuestra Señora del Rosario, lo que sugiere la capital como ciudad natal. Realizó sus estudios en Antioquia donde pasó después al Colegio del Rosario y allí fue acreedor del título de “colegial de número”, y también obtuvo su título como doctor en derecho. Prontamente comenzó a ejercer como profesor en varias cátedras como literatura universal, pruebas judiciales, y ciencias administrativas, entre otras. Además de su labor como docente, también fue miembro de la sociedad de los “amigos del país” en la cual se tornó como enemigo de la Compañía de Jesús, pero muy pronto volvió a las toldas de esta última institución. Algunos de los cargos representativos que ocupó fueron: procurador general del estado de Antioquia, estuvo a cargo de curules en la legislatura provincial, y representante al Congreso en 1851. También se desempeñó como vicerrector de la Institución en 1864, mientras ésta permaneció cerrada; pero fue precisamente en este lapso de tiempo en que se realizaron algunos arreglos en el lugar. En ese mismo año, Pedro Justo Berrío presentó un decreto por medio del cual se permitió la apertura del Colegio, nombrando a su vez como rector y catedrático a Román de Hoyos. No obstante es necesario mencionar que su cargo estuvo opacado por la labor que ejerció Pedro Justo Berrio en el plantel, siendo este último el encargado de dictar algunas clases. César García describe el trabajo de Román de Hoyos como un “superintendente” del instituto. Hoyos se desempeñço como rector hasta 1873, dándose en su periodo rectoral un asunto esencial referido a la ley que establece que el lugar que funcionaba como Colegio del Estado de Antioquia serviría para la “Universidad de Antioquia”, nombre que recibió en 1871."
                    },

                    "media": {
                        "url": "img/rectores-xix/ramon-de-hoyos.jpg",
                        "caption": "Foto oficial del rector Román de Hoyos"
                        
                    }
                },

                {
                    "start_date": { "year": "1871" },
           
                    "text": {
                      
                        "text": "El cambio de nombre dado a esta institución, solo se dio hasta 1871 bajo el rectorado del señor Ramón de Hoyos. Durante este proceso entró a mediar un conflicto competitivo que surgió debido a la instauración en ese entonces de la Universidad Nacional de Colombia, pues la creación de ésta trajo ciertos desacuerdos por parte de muchos personajes (conservadores), los cuales defendían “que era una obligación, no solo de católicos sino también de hombres honrados, negarle todo apoyo a la Universidad Nacional, pues ella y el Colegio del Rosario, afirmaban estos, se habían convertido en nidos de utilitarismo y de inmundicia”, convocando a su vez a que los padres de jóvenes estudiantes enviaran a sus hijos a una universidad católica para que aprendieran y promulgaran las ideas allí aprendidas. Así pues, debido a ello y otros asuntos de tipo jurídico, se presentó un proyecto con el cual la Alma Máter dejó de ser Colegio del Estado de Antioquia para convertirse en Universidad de Antioquia , bajo la ley 198 de octubre de 1871, sancionada por Pedro Justo Berrio, gobernador del estado de Antioquia, quieb posteriormente pasaría a ser rector de la universidad. Además de la competencia que significaba esta creación, la UdeA creó las mismas seis escuelas que tenía la Universidad Nacional: Literatura y Filosofía, Ingeniería, Ciencias Físicas y Naturales, Medicina, Jurisprudencia y Ciencias Políticas, y Artes y Oficios. No obstante, se implementaron con mayor fuerza los principios católicos, que en última instancia constituyen la idea esencial para marcar la diferencia entre estas dos universidades."
                    }
                },

                {
                    "start_date": { "year": "1873" },
                    "end_date": { "year": "1874" },
                    "text": {
                        "headline": "Pedro Justo Berrío",
                        "text": "Sin duda Pedro Justo Berrío puede ser destacado como uno de los personajes más importante en materia de gobierno y administración en Antioquia, además de haber sido una de las caras más representativas del conservatismo antioqueño. Nació en Santa Rosa de Osos (Antioquia) en 1827. A los 16 años se dedicó por completo a sus estudios mayores en el seminario de San Fernando de Antioquia, en donde estudio filosofía y teología, culminando su aprendizaje de jurisprudencia en Bogotá. Fue precisamente en Antioquia donde se comenzó a ver el resultado de sus años en la academia; igualmente se destacó en el ámbito político con la ayuda que brindó a la deposición de los lideres liberales en 1851, convirtiéndose así poco a poco en líder conservador, aportando tanto en lo político como en el campo militar con el derrocamiento del líder liberal Pascual Bravo, ocurrido en 1864. Una vez fue proclamado presidente del estado, se encargó de ejecutar diversos proyectos que tendrían que ver con la administración correspondiente al nuevo cargo. Algunos de estos proyectos fueron la unidad nacional bajo la constitución de Rionegro, dándose a conocer así aun más en el campo gubernamental, y otro, no menos importante, es el apoyo que ofrece con la educación al sector social tanto en el espacio universitario como en las escuelas. Propuso en este último, un amplio escenario donde se obligó la participación de la sociedad para la elaboración de escuelas (muchas de ellas en el estado de Antioquia) y asistencia a las mismas. Además se destacó por velar en la protección de los indígenas y sus derechos. Uno de esos aspectos importantes que marcó el paso de Berrío por el campo educativo fue la contribución en el campo de los métodos de enseñanza y las diferentes formas de comunicar las ideas a los alumnos, que incluía métodos, elementos prácticos y una formación docente diferente. Pedro Justo Berrio impulsó en la Institución la consolidación de la formación técnica y aplicativa como la Escuela de Artes y Oficios que permitiera contribuir a la aplicación para la industria, un tema de interés que destacó la importancia universitaria en otras maneras de integrar estos dos campos de la sociedad (academia e industria). De esta forma puede demostrarse que no solamente se da un avance a nivel educativo, sino que este mismo objetivo se vio atravesado por el inicio de proyectos que hasta ahora han tenido un auge económico en gran cantidad, como por ejemplo el sector textilero antioqueño, que comenzó precisamente con la idea de Pedro Justo Berrío del “despegue de la industria en la región”. Berrío mantuvo un vínculo con la Universidad desde 1865, período durante el cual dictó algunas clases; pero en 1873 –cuando termina su periodo en la presidencia– fue nombrado para ponerse al frente de la Universidad de Antioquia, realizando un trabajo de unión y empuje académico al frente de ésta. La muerte de su esposa le generó complicaciones de salud y murió el 14 de febrero de 1875 en Medellín."
                    },

                    "media": {
                        "url": "img/rectores-xix/pedro-justo-berrio.jpg",
                        "caption": "Foto oficial del rector Pedro Justo Berrío"
                        
                    }
                },

                {
                    "start_date": { "year": "1874" },
                    "end_date": { "year": "1876" },
                    "text": {
                        "headline": "Pbro. José María Gómez Ángel",
                        "text": "El sacerdote José María Gómez Ángel tuvo una amplia participación social y política en Antioquia. Este personaje contribuyó en algunos aspectos relacionados con mejoras en lo urbano, y estuvo vinculado a algunos cargos directivos en seminarios, universidades e incluso fue considerado como párroco de la catedral de Medellín. Estudió en la Escuela Lancasteriana en Medellín y luego en el Colegio Académico entre 1836 y 1840. Al finalizar su formación académica en la Institución, comenzó a cursar jurisprudencia hasta 1842. Luego de ello pasó al seminario de San Fernando donde cursó las materias necesarias para su ordenación como sacerdote. Se encargó de dictar algunas cátedras en el seminario, y debido al buen desempeño que tuvo en su ejercicio docente ocupó la vicerrectoría del seminario. En 1847 fue ordenado sacerdote por el señor Gómez Plata. El 6 de julio de 1874 fue nombrado rector de la Universidad de Antioquia en reemplazo de Pedro Justo Berrio, pero renunció dos años después debido a problemas de salud. No obstante su actividad en la Universidad se vio enmarcada por un nuevo plan de estudios que presentó en el mismo año de su nombramiento. Además se encargó de dictar la clase de latín, a la vez que ejercía como docente en el seminario de San Fernando, donde dictaba asignaturas como derecho canónico, teología dogmática, y sagradas escrituras, entre otras. Como cura realizó diversas labores en diferentes municipios de Antioquia como Barbosa, Concordia y Támesis entre otros, donde trabajó, según relata la socióloga María Teresa Uribe, a la par con los habitantes de cada lugar, logrando así diversos cambios en la estructura urbana, lo que no fue difícil porque anteriormente había tenido experiencias con la ingeniería y la arquitectura. José María Gómez Ángel falleció el 22 de marzo de 1896."
                    },

                    "media": {
                        "url": "img/rectores-xix/jose-maria-gomez-angel.jpg",
                        "caption": "Foto oficial del rector Pbro. José María Gómez Ángel"
                        
                    }
                },

                {
                    "start_date": { "year": "1876" },
                    
                    "text": {
                        "headline": "Ramón Martínez Benítez",
                        "text": "Este abogado nació en 1824 en Cartago (Valle del Cauca). Su madre y abuelo siempre estuvieron muy pendientes de su educación, la cual realizó entre Cali, Cartago y Bogotá, sobresaliendo en su actividad académica. Estudió jurisprudencia siendo discípulo de personajes como José Ignacio de Márquez y Ezequiel Rojas. Al graduarse en la capital se trasladó a su tierra natal donde ejerció como abogado, pero para 1851 se vio obligado a salir de Cartago por culpa de la violencia. En medio de los sucesos de la época, varios pensadores debieron salir de sus lugares habituales para buscar refugio en Antioquia, entre ellos, el señor Ramón Martínez, quien con sus familiares se desplazó hasta Medellín, ocupándose inicialmente como juez de circuito y posteriormente en el tribunal superior. Durante su periodo como rector de la Universidad de Antioquia tuvo que afrontar el cierre de la Institución a causa de la guerra civil, razón por la cual las instalaciones fueron ocupadas por el ejército. Como magistrado fue testigo de los diversos problemas entre el ente político y eclesiástico en los Estados Unidos de Nueva Granada. Por otro lado, sirvió al estado participando en la asamblea constituyente, y en 1865 fue elegido senador. En 1879, debido a sus problemas de salud, se trasladó con su familia a Rionegro donde murió el 13 de septiembre de 1882."
                    },

                    "media": {
                        "url": "img/rectores-xix/ramon-martinez-benitez.jpg",
                        "caption": "Foto oficial del rector Ramón Martínez Benítez"
                        
                    }
                },

                {
                    "start_date": { "year": "1878" },

                    "text": {
                       
                        "text": "La Alma Máter de los antioqueños ha debido afrontar cambios significativos que han aportado al desarrollo social, económico, político y educativo del país. Es por esto que la universidad pública más antigua del país a lo largo de su historia también mutó de nombre en múltiples ocasiones durante el siglo XIX. La ley 71 de 1878, en su artículo 6, decretó que la institución pasaría a llamarse Colegio Central de la Universidad, lo cual trajo cambios en la dirección, pues los liberales quedaron al frente del centro de formación como resultado de la guerra del 76. Estos líderes se encargaron de desvincular del claustro las ideas y proyectos impulsados por Berrío. Uno de los cambios fue el nombre del lugar, que deja de ser Universidad de Antioquia para pasar a ser Colegio Central de la Universidad. Con los cambios realizados por los liberales se abolieron también las cátedras de religión y las prácticas que se mantenían como culto católico; sin embargo, se conservaron la Escuela de Artes y Oficios, la Escuela de Jurisprudencia y la Escuela de Medicina. Así mismo, quienes se encargaron de la enseñanza fueron profesores de corte liberal que abogaban por la formación de ciudadanos libres."
                    }
                },

                {
                    "start_date": { "year": "1878" },
                    "end_date": { "year": "1881" },
                    "text": {
                        "headline": "Rafael Campuzano",
                        "text": "Este doctor en medicina nació en 1822 en Rionegro. Realizó sus estudios universitarios en la capital. Posteriormente regresó a Antioquia para ejercer su profesión, vinculándose con la educación en los municipios de San Roque y Jericó. Se destacó por su ejercicio principalmente como político y acompañante de las fuerzas militares –en calidad de médico– de Tomas Herrán y Pascual Bravo, además como lo describe Julio César García en su texto de biografías, Campuzano servía profesionalmente tanto a conservadores como liberales, siendo partidario político de este último. A Rafael Campuzano le correspondió dirigir la Institución durante la reapertura del Colegio Central (ya que había permanecido cerrada por la guerra). Sin embargo, la desconfianza de los padres de los alumnos matriculados en la Universidad generó controversias y dificultades a la hora de guiarla, puesto que la enseñanza ya no estaba basada en los preceptos católicos y el claustro estaba volviendo a las ideas de Betham. En 1881 se retiró Campuzano de la rectoría pasando a ocupar una curul como legislador. Un año después se dedicó a la presidencia de la Academia de Medicina. Rafael Campuzano falleció tiempo después, en mayo de 1891, siendo recordado como un médico de grandes aportes a la vida política del país."
                    },

                    "media": {
                        "url": "img/rectores-xix/rafael-campuzano.jpg",
                        "caption": "Foto oficial del rector Rafael Campuzano"
                        
                    }
                },

                {
                    "start_date": { "year": "1881" },
                    "end_date": { "year": "1882" },
